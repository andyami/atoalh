const SEED_COOKBOOKS = [{"id": "CB01", "name": "Breakfasts", "description": "rise and shine", "colour": "#FFD166"}, {"id": "CB02", "name": "Dinners", "description": "12pm already?", "colour": "#EE6C4D"}, {"id": "CB03", "name": "Teas", "description": "weeknights or weekends when the meal preps really aren't it", "colour": "#839973"}, {"id": "CB04", "name": "Cooking Together", "description": "will we ever get round to trying these?", "colour": "#4361EE"}, {"id": "CB05", "name": "Sandwiches", "description": "mission to make the perfect sandwich", "colour": "#BC6C25"}, {"id": "CB06", "name": "Date Nights", "description": "its just me and you baby", "colour": "#641220"}, {"id": "CB07", "name": "Low Calorie", "description": "beach body in no time", "colour": "#90E0EF"}, {"id": "CB08", "name": "Quick", "description": "five minute timer, GO!", "colour": "#FF8A5B"}, {"id": "CB09", "name": "Protein", "description": "what way is the beach?", "colour": "#2F4858"}, {"id": "CB10", "name": "Snacks", "description": "all things snacky", "colour": "#FFB4A2"}, {"id": "CB11", "name": "Desserts", "description": "yes its that time, its sweet treat time", "colour": "#A29BFE"}, {"id": "CB12", "name": "Basics & Staples", "description": "the boring bits that make everything else work", "colour": "#118AB2"}];

const SEED_RECIPES = [{"id": "R001", "name": "Anthony Bourdain's Favourite Sandwich", "description": "Crispy fried mortadella stacked with melted provolone on a toasted white bun", "cookbooks": ["CB02", "CB04", "CB05"], "tags": ["#sandwich", "#pork", "#quick", "#lunch"], "servings": 2, "prepTime": 5, "cookTime": 10, "calories": null, "protein": null, "fat": null, "ingredients": "180g mortadella (9 slices)|27g olive oil (2 tbsp)|1 white bun|14g mayonnaise (1 tbsp)|15g Dijon mustard (1 tbsp)|provolone cheese (to taste)", "method": "Heat a large frying pan with a little olive oil. Scrunch and fold 3 pieces of mortadella and fry separately on both sides until crispy. Stack the fried mortadella, slice the provolone and place on top. Add a splash of water and cover until the provolone melts. Repeat twice more.|Slice and toast your bun in the same pan with a little olive oil. Spread mayonnaise on the bottom half and Dijon mustard on the top half.|Place the stack of mortadella and melted cheese on the bottom bun, then add the top bun.", "rating": null, "cooked": false, "notes": ""}, {"id": "R002", "name": "Bacon Cheddar Biscuits", "description": "Almond flour biscuits packed with bacon, cheddar and green onion — serve with butter or cottage cheese", "cookbooks": ["CB01", "CB02", "CB04"], "tags": ["#biscuits", "#bacon", "#snacks", "#baking", "#protein"], "servings": 8, "prepTime": 10, "cookTime": 12, "calories": null, "protein": null, "fat": null, "ingredients": "150g almond flour|4 eggs|45g Greek yogurt (3 tbsp)|170g uncured bacon, cooked and diced (approx. 6 strips)|140g shredded cheddar (habanero cheddar recommended)|25g green onion, sliced|8g baking powder (2 tsp)|0.5 tsp baking soda|3g garlic powder (1 tsp)|0.5 tsp onion powder|3g salt (0.5 tsp)|0.25 tsp black pepper", "method": "Preheat the air fryer to 180°C. Line both drawers with baking paper or perforated liners.|In a large bowl, whisk the almond flour, baking powder, baking soda, garlic powder, onion powder, salt and pepper. In a small bowl, beat the eggs and Greek yogurt. Fold the egg mixture, bacon, green onions and 110g of cheddar into the dry ingredients until well combined and the mixture begins to thicken.|Using a cookie scoop, scoop 8 balls of dough, 4 into each drawer. Gently press down each ball to form a biscuit and top with the remaining cheddar.|Air fry at 180°C for 10–12 minutes until risen, golden and cooked through. Serve with butter or cottage cheese and avocado.", "rating": null, "cooked": false, "notes": "AIR FRYER: 4 biscuits per drawer keeps them from touching, which is what lets the sides set rather than steam. OVEN: preheat to 200°C (400°F), grease a large baking sheet, arrange all 8 and bake for 9–11 minutes."}, {"id": "R003", "name": "Chicken & Chorizo in a Creamy Garlic & Herb Sauce", "description": "Diced chicken and chorizo in a rich cream cheese and herb sauce — great with rice or mash", "cookbooks": ["CB03", "CB06"], "tags": ["#chicken", "#chorizo", "#teas", "#one-pan"], "servings": 4, "prepTime": 10, "cookTime": 25, "calories": null, "protein": null, "fat": null, "ingredients": "50g chorizo, diced|500g chicken breast, diced|16g chicken seasoning (2 tbsp)|1 onion, finely diced|3 cloves garlic, minced|16g plain flour (2 tbsp)|500ml chicken stock|100g cream cheese|1 tsp dried parsley|1 tsp dried oregano|0.5 tsp dried dill|5g mustard (1 tsp) (optional)|15g lemon juice (1 tbsp)|salt and pepper to taste|chilli flakes and fresh parsley to garnish (optional)", "method": "Add the chorizo into a pan and cook until crispy, then remove. In the same pan, add the chicken seasoned with chicken seasoning. Once browned, add the onion and cook until soft, then add the garlic and cook for 30 seconds.|Add the flour and cook out for a few minutes. Slowly add the stock bit by bit, stirring continuously, until a thicker sauce forms.|Add the cream cheese, seasonings, mustard and lemon juice. Season to taste. Return the chorizo.|Garnish with chilli flakes and parsley. Serve and enjoy.", "rating": null, "cooked": false, "notes": ""}, {"id": "R004", "name": "Chicken Alfredo Garlic Bread", "description": "Seasoned chicken breast and creamy Alfredo sauce piled onto garlic butter Italian bread, baked until golden", "cookbooks": ["CB02", "CB04"], "tags": ["#chicken", "#garlic-bread", "#baking"], "servings": 4, "prepTime": 20, "cookTime": 35, "calories": null, "protein": null, "fat": null, "ingredients": "For the chicken: 454g boneless skinless chicken breast, halved lengthwise and pounded|salt to taste|7g smoked paprika powder (1 tbsp)|9g garlic powder (1 tbsp)|1 tsp black pepper|1 tsp onion powder|28g clarified butter or oil for cooking (2 tbsp)||For the Alfredo sauce: 18g fresh garlic (2 tbsp), finely minced|28g butter (2 tbsp)|240ml unsweetened heavy whipping cream|salt to taste|1 tsp black pepper|50g Parmesan cheese, freshly grated||For the garlic butter: 115g unsalted butter, softened|9g fresh garlic (1 tbsp), finely minced|4g fresh parsley (1 tbsp), finely chopped||To assemble: 1 loaf Italian bread|100g mozzarella cheese", "method": "Preheat oven to 180°C (350°F).|Season chicken with salt, pepper, paprika, garlic powder and onion powder on both sides.|Heat clarified butter in a pan over medium heat. Cook seasoned chicken for 4–5 minutes per side until internal temperature reaches 74°C (165°F). Remove, slice and set aside.|In another pan, melt butter over medium-low heat. Add garlic and sauté until fragrant. Add heavy cream and bring to a boil. Gradually add Parmesan. Season with salt and pepper. Cook until sauce thickens.|Make garlic butter by mixing softened butter, garlic, parsley and a pinch of salt in a bowl.|Cut the loaf in half lengthwise and spread 2–3 tbsp garlic butter on it. Add the Alfredo sauce, mozzarella, and sliced chicken. Add more Alfredo on top with some parsley.|Place on a baking sheet and bake for 20–25 minutes until bread is crispy and cheese is golden. Serve warm.", "rating": null, "cooked": false, "notes": "AIR FRYER: a whole loaf won't fit a drawer. Cut the assembled halves into drawer-length pieces and air fry at 180°C for 8–10 minutes until the cheese is golden and the base is crisp."}, {"id": "R005", "name": "Cottage Cheese Pizza", "description": "High-protein pizza with a cottage cheese and egg white crust — low calorie and surprisingly good", "cookbooks": ["CB04", "CB07", "CB09"], "tags": ["#pizza", "#protein", "#low-calorie", "#baking"], "servings": 2, "prepTime": 15, "cookTime": 20, "calories": null, "protein": null, "fat": null, "ingredients": "70g self-rising flour (or plain flour + pinch of salt + 4g baking powder)|12g coconut flour|5g nutritional yeast|150g 2% cottage cheese|75g egg whites|90g pizza sauce|56g part-skim mozzarella", "method": "Blend cottage cheese and egg whites together until smooth.|Add the dry ingredients to a bowl and mix to avoid clumping. Add the cottage cheese and egg white mixture and mix until you get a thick paste.|Add dough to the middle of a large piece of parchment paper. Spread the crust out to about 30–33cm, working from the inside out in a circular motion, keeping the edges thick.|Transfer the parchment with the crust to a pan and bake at 230°C (450°F) for 8–10 minutes until golden.|Remove from parchment and return the crust to the pan. Add your toppings and bake until toppings are golden.|Slice and enjoy.", "rating": null, "cooked": false, "notes": "AIR FRYER: a 30–33cm base won't fit. If you want to use it, split the dough into two smaller bases, cook each at 200°C for 6–8 minutes, then 3–4 minutes more once topped."}, {"id": "R006", "name": "Creamy Garlic Parmesan Chicken Pasta", "description": "Marinated pan-seared chicken breast in a rich garlic Parmesan cream sauce over pasta", "cookbooks": ["CB03", "CB06"], "tags": ["#chicken", "#pasta"], "servings": 4, "prepTime": 15, "cookTime": 30, "calories": null, "protein": null, "fat": null, "ingredients": "For the chicken: 454g boneless chicken breast, pounded slightly|salt to taste|1 tsp smoked paprika powder|9g garlic powder (1 tbsp)|1 tsp black pepper|27g oil (2 tbsp) (for marinade)|28g clarified butter/ghee (2 tbsp)|14g butter (1 tbsp)||For the sauce: 1 small yellow onion, finely chopped|9g fresh garlic (1 tbsp), minced|16g all-purpose flour (2 tbsp)|360ml chicken broth (or 1 stock cube in 360ml water)|360ml unsweetened heavy whipping cream|salt to taste|7g smoked paprika powder (1 tbsp)|1 tsp red chilli flakes|0.5 tsp black pepper|3g garlic powder (1 tsp)|4g dried parsley (1 tbsp)|3g Italian seasoning (1 tbsp)|50g Parmesan cheese, freshly grated||To assemble: 283g pasta of choice, cooked", "method": "Season chicken with salt, pepper, garlic powder, smoked paprika and oil. Mix to coat evenly and marinate for at least 1 hour.|Heat pan on medium, add clarified butter. Once hot, cook chicken 8–10 minutes flipping halfway until cooked through (74°C / 165°F internally). Remove, slice and set aside.|In the same pan add butter once melted. Sauté onions for 1 minute until translucent. Add garlic for 30 seconds. Add all seasonings and flour and mix.|Gradually add chicken broth, stirring until sauce thickens. Cook 2–4 minutes on medium. Stir in heavy cream and whisk. Add Parmesan and parsley, mixing well.|Add cooked pasta and top with sliced chicken. Mix everything together. Top with more Parmesan if desired.", "rating": null, "cooked": false, "notes": ""}, {"id": "R007", "name": "Creamy Pesto Chicken & Hasselback Potatoes", "description": "Pan-fried chicken breast in a pesto cream sauce with crispy air-fryer hasselback potatoes", "cookbooks": ["CB03", "CB06"], "tags": ["#chicken", "#potatoes", "#pesto", "#air-fryer"], "servings": 2, "prepTime": 10, "cookTime": 40, "calories": null, "protein": null, "fat": null, "ingredients": "300g potato|300g chicken breast|1 tsp paprika|4g oil (1 tsp)|30g low fat pesto|80ml low fat cream|150ml chicken stock|30g bacon lardons|salt and pepper to taste", "method": "Cut slices in the potatoes (hasselback style) then season with oil, salt and pepper.|Air fry potatoes for 30 mins at 180°C.|Season chicken breast with paprika, salt and pepper. Ensure pieces are thin. Pan fry the chicken until golden then set aside.|In the same pan, add the bacon and fry until cooked.|Add the stock, cream and pesto. Stir over a low heat until it thickens, then add the chicken back in and cook for a further 5 minutes.|Top with parsley and serve with the potatoes and some broccoli.", "rating": null, "cooked": false, "notes": ""}, {"id": "R008", "name": "Crunchy Roasted BBQ Chickpeas", "description": "Crispy oven-roasted chickpeas coated in a smoky BBQ spice mix — great healthy snack", "cookbooks": ["CB04", "CB10"], "tags": ["#chickpeas", "#baking"], "servings": 4, "prepTime": 5, "cookTime": 18, "calories": null, "protein": null, "fat": null, "ingredients": "250g canned chickpeas (drained and rinsed)|40g maple syrup or date syrup (2 tbsp)|0.5 tsp smoked paprika powder|0.5 tsp chilli powder|0.5 tsp cumin powder|0.5 tsp onion powder|0.5 tsp garlic powder|3g salt (0.5 tsp)", "method": "Drain and rinse the chickpeas, then place in a bowl.|In another bowl, pour in the maple syrup (or date syrup).|Add all the spices and salt to the syrup and mix until well combined.|Combine the chickpeas with the syrup and spice mixture, ensuring they are evenly coated.|Tip into one air fryer drawer in a single layer — 250g fits comfortably.|Air fry at 180°C for 15–18 minutes, shaking the drawer every 5 minutes, until they rattle and feel dry. They crisp up further as they cool.", "rating": null, "cooked": false, "notes": "AIR FRYER: 180°C rather than the oven's 200°C — the fan concentrates the syrup and it catches fast at higher heat. Don't crowd the drawer; a single layer is what makes them crunchy rather than chewy. OVEN: spread on a baking sheet and bake at 200°C (400°F) for 25 minutes."}, {"id": "R009", "name": "Garlicy Soy Chicken Rice", "description": "One-pot Asian-style rice cooked in a garlic soy sauce broth with chicken — top with a fried egg", "cookbooks": ["CB03", "CB06"], "tags": ["#chicken", "#rice", "#asian", "#one-pan"], "servings": 2, "prepTime": 10, "cookTime": 25, "calories": null, "protein": null, "fat": null, "ingredients": "300g basmati rice|450ml boiling water|1 chicken stock cube|30g rice wine (2 tbsp)|36g oyster sauce (2 tbsp)|16g dark soy sauce (1 tbsp)|16g sriracha (1 tbsp)|11g light soy sauce (2 tsp)|9g sesame oil (2 tsp)|2 cloves garlic, grated|4 chicken thigh fillets|4 spring onions, finely chopped|chilli oil to serve|2 fried eggs (optional)", "method": "Place rice in a saucepan. Whisk the water with the stock cube, then add rice wine, oyster sauce, dark soy, sriracha, light soy, sesame oil and garlic. Pour over the rice and place chicken thighs on top.|Bring to the boil over medium heat. Cover, reduce heat to low and cook for 20 minutes until all liquid is absorbed and chicken is cooked through.|Remove from heat and stand for 5 minutes. Add spring onions and chilli oil. Serve immediately with fried eggs if using.", "rating": null, "cooked": false, "notes": ""}, {"id": "R010", "name": "Loaded Bacon & Roasted Garlic Potatoes", "description": "Thinly sliced potatoes layered with a roasted garlic cheddar sauce and crispy bacon — au gratin style", "cookbooks": ["CB03", "CB06"], "tags": ["#potatoes", "#bacon"], "servings": 6, "prepTime": 20, "cookTime": 65, "calories": null, "protein": null, "fat": null, "ingredients": "170g bacon (approx. 6 strips)|5–6 cloves roasted garlic|28g butter (2 tbsp)|16g all-purpose flour (2 tbsp)|480ml whole milk|340g cheddar, grated (for sauce)|0.25 tsp paprika|1 tsp dried thyme|1 tsp dried rosemary|170g cheddar, grated (for topping)|700g yukon or similar potatoes (4–5 medium), peeled and thinly sliced|salt and pepper to taste", "method": "Preheat oven to 190°C (375°F). Grease a 23x33cm baking dish.|Cook bacon in a large skillet until crispy. Remove, crumble and set aside. Reserve 2–3 tbsp bacon fat.|Add butter to the skillet with bacon fat. Once melted, add flour and whisk into a roux. Cook 1–2 minutes until golden.|Gradually pour in milk, whisking constantly until thickened.|Add roasted garlic, salt, pepper, paprika, thyme and rosemary. Stir to combine. Gradually add 340g cheddar until the sauce is creamy.|Arrange sliced potatoes in the baking dish. Pour the cheese sauce over, ensuring even coverage. Sprinkle crumbled bacon on top. Cover with foil and bake for 45 minutes.|Uncover, add remaining 170g cheddar on top and bake a further 15–20 minutes until potatoes are tender and top is golden and bubbly.|Rest for a few minutes before serving.", "rating": null, "cooked": false, "notes": "Stays in the oven — a 23x33cm dish won't fit a drawer, and layered potatoes need the long, even bake to go tender all the way through."}, {"id": "R011", "name": "Marry Me Chicken Pasta", "description": "Quick and easy chicken pasta in a light cream cheese and sun-dried tomato sauce", "cookbooks": ["CB03", "CB06"], "tags": ["#chicken", "#pasta"], "servings": 2, "prepTime": 10, "cookTime": 20, "calories": null, "protein": null, "fat": null, "ingredients": "70g tagliatelle|25g light cream cheese|1 chicken stock pot dissolved in 60ml boiling water|20g sundried tomatoes|120g raw chicken breast|handful of cherry tomatoes and spinach (approx. 50g each)|10g light grated cheese|60ml soy milk|0.5 red pepper, sliced|0.25 onion, sliced", "method": "Slice the chicken, tomatoes and onion. Fry for 7 minutes with a pinch of salt, pepper and chicken seasoning.|Boil the tagliatelle for 8–10 minutes until soft.|Add the soy milk, cream cheese, spinach and stock water to the pan. Stir on a medium heat until the liquid condenses. Add the pasta and the grated cheese after a couple of minutes.|Mix together and enjoy.", "rating": null, "cooked": false, "notes": ""}, {"id": "R012", "name": "OREO Protein Balls", "description": "No-bake frozen protein balls made with Greek yogurt and crushed Oreos — defrost 5–10 mins before eating", "cookbooks": ["CB04", "CB09", "CB10", "CB11"], "tags": ["#oreo"], "servings": 17, "prepTime": 15, "cookTime": 0, "calories": null, "protein": null, "fat": null, "ingredients": "250g Greek yogurt (plain or vanilla)|60g coconut flour|40g vanilla whey protein powder|1 tbsp sweetener (optional)|4 Oreos, crushed", "method": "Combine all ingredients except Oreos until a thick batter forms — it should be very thick and hard to mix. Stir in the crushed Oreos.|Form balls with the mixture (makes approx. 17). Tip: wash hands between every 3 balls to prevent sticking.|Freeze until solid. Drizzle with white chocolate and more crushed Oreos if desired.|Store in the freezer. Defrost for 5–10 minutes before eating.", "rating": null, "cooked": false, "notes": ""}, {"id": "R013", "name": "Steak au Poivre with Dauphinoise Potatoes", "description": "Pepper-crusted sirloin steak in a rich cognac cream sauce served alongside a classic French potato gratin", "cookbooks": ["CB06"], "tags": ["#steak", "#potatoes"], "servings": 2, "prepTime": 20, "cookTime": 50, "calories": null, "protein": null, "fat": null, "ingredients": "For the dauphinoise: 600g potatoes, peeled and thinly sliced|300ml heavy cream|150ml whole milk|2 cloves garlic|3 sprigs fresh thyme|pinch of nutmeg|salt and pepper|butter for greasing||For the steak: 2 sirloin or fillet steaks (approx. 200g each)|14g whole black peppercorns (2 tbsp), coarsely crushed|14g oil (1 tbsp)|14g butter (1 tbsp)|1 shallot, finely minced|60ml brandy or cognac|120ml beef stock|120ml heavy cream|5g Dijon mustard (1 tsp)|salt", "method": "Preheat oven to 180°C. Grease a small baking dish with butter and rub with a halved garlic clove.|Warm the cream, milk, thyme, garlic and nutmeg in a saucepan. Season well. Place sliced potatoes in a bowl, pour over the cream mixture and mix to coat.|Layer potatoes in the baking dish. Cover with parchment and bake for 25 minutes. Remove parchment and bake a further 15–20 minutes until golden and tender.|Pat steaks dry and press coarsely crushed peppercorns firmly into both sides. Season with salt.|Heat oil in a heavy pan over high heat. Sear steaks for 2–3 minutes per side for medium rare. Remove and rest for 10 minutes.|In the same pan over medium heat, add butter and shallot and cook for 1 minute. Add brandy and cook until reduced by half. Add beef stock and reduce by half again. Stir in heavy cream and Dijon mustard. Simmer until the sauce coats the back of a spoon.|Serve steaks with the sauce spooned over and dauphinoise alongside.", "rating": null, "cooked": false, "notes": "Start the dauphinoise first — it takes the longest. A mandolin is very helpful for slicing the potatoes evenly. The dauphinoise stays in the oven: it needs slow, even heat and a dish deeper than an air fryer drawer will take."}, {"id": "R014", "name": "Crispy Sesame Beef Noodle Bowls", "description": "Ramen-inspired bowls with crispy sesame beef, pak choi and egg noodles in a garlicky soy broth", "cookbooks": ["CB03", "CB06"], "tags": ["#beef", "#noodles", "#ramen"], "servings": 2, "prepTime": 10, "cookTime": 35, "calories": null, "protein": null, "fat": null, "ingredients": "250g beef mince|2 eggs|1 pak choi|3g chilli flakes (1.5 tsp)|7g sesame oil (0.5 tbsp)|1 clove garlic, finely chopped|12.5g fresh ginger, finely chopped|3 spring onions, sliced|500ml chicken stock|16g soy sauce (1 tbsp)|250g egg noodles|vegetable oil for cooking", "method": "Boil the eggs for 6 minutes, then transfer to a bowl of ice cold water and chill for 5 minutes. Peel and set aside.|Heat a good drizzle of vegetable oil in a frying pan. Add the beef mince and break it up. Cook until nice and crispy.|Add the ginger, garlic and spring onions to the pan. Add the soy sauce, chilli flakes (save a pinch for later) and sesame oil. Mix together.|Heat the chicken stock in a saucepan. Once hot, add the egg noodles and cook until softened. Add the pak choi and cook through.|Divide noodles between bowls, spoon in a few ladles of stock and pak choi. Add the crispy beef and one boiled egg, cutting it open to reveal the runny yolk. Sprinkle remaining chilli flakes over the top.", "rating": null, "cooked": false, "notes": "Source: mob.co.uk"}, {"id": "R015", "name": "\"Marry Me\" Chicken Orzo", "description": "Chicken breast and orzo cooked together in a creamy sun-dried tomato and pesto sauce", "cookbooks": ["CB03", "CB06"], "tags": ["#chicken", "#orzo", "#creamy", "#one-pan"], "servings": 2, "prepTime": 10, "cookTime": 40, "calories": null, "protein": null, "fat": null, "ingredients": "1 onion, finely diced|235g chicken breast, chopped into bite-sized chunks|55g sun-dried tomatoes, sliced|1-2 garlic cloves, crushed|400ml chicken stock|0.75 tsp dried oregano|0.75 tsp dried thyme|13g reduced-fat red pesto|160g orzo|80ml single cream|35g fresh basil|Parmesan to serve|7g oil from sun-dried tomato jar (0.5 tbsp)", "method": "Finely dice the onion, chop the chicken, slice the sun-dried tomatoes and crush the garlic.|Add 0.5 tbsp oil from the sun-dried tomato jar to a deep pan. Add the onion and garlic and cook for a few minutes until softened. Add the chicken and cook for around 10 minutes until cooked through.|Add the sun-dried tomatoes, oregano, thyme, pesto and a pinch of salt and pepper. Stir to coat, then pour in about 90% of the stock. Bring to the boil.|Tip in the orzo and reduce to a simmer. Cook for around 7 minutes until most liquid is absorbed (add remaining stock plus extra water if needed). Stir in the cream and cook for a further 3 minutes until the orzo is fully cooked.|Stir through torn basil, divide between bowls and top with extra basil and Parmesan.", "rating": null, "cooked": false, "notes": "Source: mob.co.uk"}, {"id": "R016", "name": "Chicken & Basil Stir Fry", "description": "Thai-inspired Pad Kra Pao with chicken mince, tenderstem broccoli and Thai basil in a punchy sauce — great for meal prep", "cookbooks": ["CB03", "CB06"], "tags": ["#chicken", "#stir-fry"], "servings": 2, "prepTime": 10, "cookTime": 25, "calories": null, "protein": null, "fat": null, "ingredients": "100g jasmine rice|15ml vegetable oil|250g chicken mince|100g tenderstem broccoli, chopped into bite-sized pieces|10g Thai basil|2 eggs||For the sauce: 1 shallot|1 red chilli|2-3 garlic cloves|28g sriracha (1.75 tbsp)|fish sauce to taste|27g oyster sauce (1.5 tbsp)|24g dark soy sauce (1.5 tbsp)|15g caster sugar", "method": "Cook the rice following packet instructions.|Make the sauce: add all sauce ingredients to a food processor and blend until smooth (some texture is fine). Taste and season with fish sauce. Set aside.|Heat a large pan or wok over high heat and add the vegetable oil. Once hot, add the chicken mince and cook for 3 minutes, breaking it up. Add the sauce and cook for another 2–3 minutes.|Add the broccoli and cook for 3–4 minutes until tender. Add the basil leaves and toss through to wilt. Season with fish sauce if needed.|For the eggs, either boil for 7 minutes then peel and store in the fridge, or fry them fresh each time.|To serve: plate up the rice and chicken and finish with an egg, a lime wedge and extra sriracha.", "rating": null, "cooked": false, "notes": "Source: mob.co.uk — inspired by Thai Pad Kra Pao. Keeps in fridge up to 4 days."}, {"id": "R017", "name": "Crispy Pork & Saucy Ginger Turmeric Noodles", "description": "Crispy sausage meat in a rich fragrant coconut turmeric broth with egg noodles", "cookbooks": ["CB03", "CB06"], "tags": ["#pork", "#noodles", "#coconut"], "servings": 2, "prepTime": 10, "cookTime": 25, "calories": null, "protein": null, "fat": null, "ingredients": "200g sausages|10g fresh ginger, finely chopped|0.5 red chilli, finely chopped|10g fresh coriander, stems thinly sliced|12.5g fresh mint|0.5 tsp ground turmeric|200ml coconut milk|250ml chicken stock|125g egg noodles|1 lime|15g toasted sesame seeds|olive oil", "method": "Squeeze the sausage meat out of the casings. Finely chop the ginger and chilli. Pick the coriander and mint leaves, thinly slicing the coriander stems.|Heat a drizzle of olive oil in a large saucepan over medium-high heat. Add the sausage meat and cook for 8–10 minutes, breaking it up until golden and crispy. Transfer to a plate.|Add the ginger, chilli and turmeric to the same pan and stir-fry for a few seconds until fragrant. Pour in the coconut milk and stock, scraping up any caramelised bits. Season with salt and black pepper and bring to the boil.|Drop in the noodles and cook following pack instructions. Adjust seasoning with lime juice, salt and pepper. Add a splash of water if you want it saucier.|Divide the noodles between bowls. Top with the crispy sausage and ladle over the sauce. Finish with toasted sesame seeds, fresh herbs and a wedge of lime.", "rating": null, "cooked": false, "notes": "Source: mob.co.uk"}, {"id": "R018", "name": "Sausage & Fennel Pasta", "description": "Aromatic pork sausage pasta with fennel seeds, tomato purée and cream — an instant weeknight classic", "cookbooks": ["CB03", "CB06"], "tags": ["#sausage", "#pasta", "#fennel"], "servings": 2, "prepTime": 10, "cookTime": 25, "calories": null, "protein": null, "fat": null, "ingredients": "4 pork sausages|1 onion, finely chopped|1.5 garlic cloves, sliced|1 tsp fennel seeds|0.5 tsp chilli flakes|75g tomato purée|100ml double cream|50g Parmesan, grated|250g conchiglie|25g fresh basil|olive oil|salt and pepper", "method": "Heat a wide frying pan on a medium heat. De-skin the sausages and add small balls of sausage meat to the pan with a splash of oil. Fry until brown on all sides, then remove and set aside.|Add the finely chopped onion to the pan with the sausage fat. Cook for about 10 minutes over low-medium heat until translucent.|Add the garlic, chilli flakes and fennel seeds and cook for 30 seconds until fragrant. Add the tomato purée and cook for 5–10 minutes until it starts caramelising.|Add the cream and three-quarters of the Parmesan. Mix together and season with salt and pepper.|Cook the pasta in a pan of salted boiling water. Once the water is starchy, add a good cup of it to the tomato sauce to loosen.|When the sauce is bubbling, add the sausage meat back in. Tear in some basil.|When the pasta is al dente, add it to the sauce. Stir through, adding more pasta water. Cook until it all comes together.|Serve in warm bowls topped with more Parmesan, basil and a drizzle of olive oil.", "rating": null, "cooked": false, "notes": "Source: mob.co.uk"}, {"id": "R019", "name": "Caramelised Soy Chicken in Garlic Ginger Broth with Rice", "description": "Kecap manis-glazed chicken thighs served in a fragrant garlic and ginger broth with rice and spring onion oil", "cookbooks": ["CB03", "CB06"], "tags": ["#chicken", "#rice", "#broth", "#one-pan"], "servings": 2, "prepTime": 10, "cookTime": 35, "calories": null, "protein": null, "fat": null, "ingredients": "4 boneless skinless chicken thighs|32g kecap manis (1.5 tbsp)|ground white pepper|5g fresh ginger, bashed|5 garlic cloves, bashed|350ml chicken stock|3 spring onions (whites and greens separated)|15ml neutral oil|7g sesame oil (0.5 tbsp)|3g toasted sesame seeds (1 tsp)|35ml water|0.5 cucumber, thinly sliced|250g cooked rice|sambal or chilli sauce to serve", "method": "Bash the ginger and garlic, then transfer to a saucepan with the stock. Halve the spring onion whites lengthways and add to the stock. Place over medium heat and let simmer while you prepare the rest.|Put the chicken thighs in a bowl with the kecap manis, season with salt and white pepper. Set aside to marinate.|Add the neutral oil to a frying pan with the spring onion greens over high heat. Once wilted, tip into a bowl. Stir through the sesame oil and toasted sesame seeds. Set aside as the spring onion oil.|Return the frying pan to medium-high heat. Cook the chicken for 7–8 minutes until golden brown and caramelised. Pour water into the leftover marinade and pour over the chicken. Cook until reduced to a thick sauce.|Trim and thinly slice the cucumber and season with salt.|Share the rice between bowls. Ladle over the broth and top with sliced chicken and cucumber. Drizzle with sambal and the sesame spring onion oil.", "rating": null, "cooked": false, "notes": "Source: mob.co.uk — uses chicken thighs. Kecap manis is Indonesian sweet soy sauce, available in most supermarkets."}, {"id": "R020", "name": "Spicy Pork & Sesame Noodles", "description": "Spicy gochujang pork mince with a silky tahini miso sauce and fresh herb salad over egg noodles", "cookbooks": ["CB03", "CB06"], "tags": ["#pork", "#noodles", "#spicy"], "servings": 2, "prepTime": 15, "cookTime": 35, "calories": null, "protein": null, "fat": null, "ingredients": "For the tahini miso sauce: 60g tahini|25g white miso|20ml rice vinegar|20ml shoyu soy sauce|0.5 tsp MSG (optional)|65ml water||For the herb salad: 0.5 cucumber|7.5g fresh coriander|7.5g fresh mint|4 spring onions (whites for pork, greens for salad)||For the spicy pork: 3 garlic cloves|19g gochujang (1 tbsp)|6g Korean chilli flakes (1 tbsp)|16g Chinese dark soy sauce (1 tbsp)|8g rice vinegar (0.5 tbsp)|6g sugar (0.5 tbsp)|500g 5% fat pork mince|vegetable oil||To serve: 200g egg noodles", "method": "Make the tahini miso sauce: whisk together all ingredients except the water until smooth and creamy. Slowly add the water a little at a time, whisking until velvety. Set aside.|For the herb salad: slice the cucumber in half lengthwise then thinly cut into half moons. Pick the coriander and mint leaves and finely slice the green tops of the spring onions (reserve the white parts for the pork). Toss together in a bowl.|For the spicy pork: combine all pork ingredients — excluding the mince and oil, but including the spring onion whites — in a blender and blitz until smooth and fragrant.|Heat a large frying pan over high heat. Add a glug of vegetable oil and half the pork mince. Press into the pan and let it brown on one side, then break it up. Once fully cooked, remove and repeat with remaining mince.|Add all the pork back into the pan, pour in the blended sauce. Stir and cook for another 2–3 minutes until evenly coated.|Cook noodles following packet instructions, drain and toss with the tahini miso sauce.|Divide the noodles between plates, top with the pork and fresh herb salad. Finish with an extra drizzle of tahini miso sauce.", "rating": null, "cooked": false, "notes": "Source: mob.co.uk — great for meal prep. Store pork, tahini sauce and herb salad in separate containers. Keeps 5 days in fridge."}, {"id": "R021", "name": "Sausage Gochujang Rigatoni", "description": "Spicy, sweet and creamy sausage pasta with gochujang, honey and lime — topped with coriander breadcrumbs", "cookbooks": ["CB03", "CB06"], "tags": ["#sausage", "#pasta", "#gochujang", "#spicy", "#quick"], "servings": 2, "prepTime": 10, "cookTime": 20, "calories": null, "protein": null, "fat": null, "ingredients": "1 shallot, minced|1-2 garlic cloves, minced|3 pork sausages|14g butter (1 tbsp)|19g gochujang (1 tbsp)|110ml single cream|21g honey (1 tbsp)|1 lime, juiced and zested|20g Parmesan, grated|200g rigatoni|15g fresh coriander, finely chopped|7.5g panko breadcrumbs|olive oil|salt and pepper", "method": "Mince the shallot and garlic.|Heat a drizzle of olive oil in a large pan over medium heat. Decase the sausages and crumble the meat into the pan. Fry until well browned and caramelised — don't deglaze too early as the caramelisation is crucial for flavour. Remove and set aside.|Return the pan to medium heat, add the butter. Once melted, add the shallot and garlic and fry for a few minutes until softened and fragrant.|Add the gochujang, single cream, honey and the juice of the lime. Grate in ¾ of the Parmesan. Add the caramelised sausage back in. Season with salt and pepper and leave to simmer while you cook the pasta.|Bring a large pot of salted water to the boil. Cook the rigatoni until al dente. Reserve the pasta water before draining.|Heat a glug of olive oil in a separate pan, add the breadcrumbs and fry for a minute until golden. Remove from heat, grate in the remaining Parmesan and add a small sprinkling of coriander. Mix to combine and set aside.|Add the cooked pasta to the sauce with a ladle of pasta water. Keep mixing until glossy. Add more pasta water if needed.|Add the remaining coriander and mix through. Serve scattered with the coriander breadcrumbs and grated lime zest.", "rating": null, "cooked": false, "notes": "Source: mob.co.uk — rated 4.9 on Mob."}, {"id": "R022", "name": "Garlic Butter Steak Bites & Creamy Tomato Orzo", "description": "Juicy ribeye steak bites tossed in garlic butter, served over creamy tomato-parmesan orzo", "cookbooks": ["CB02", "CB04"], "tags": ["#steak", "#orzo", "#beef"], "servings": 4, "prepTime": 10, "cookTime": 25, "calories": null, "protein": null, "fat": null, "ingredients": "For the steak: approx. 500g ribeye steak, cut into bite-sized pieces|salt, black pepper, onion powder and garlic powder to season|14g butter (1 tbsp)|9g minced garlic (1 tbsp)|fresh parsley||For the orzo: olive oil|1 white onion, diced|9g minced garlic (1 tbsp)|48g tomato paste (3 tbsp)|454g orzo, toasted 1–2 minutes in a dry pan|960ml beef stock|salt and pepper|1 tsp paprika|1 tsp crushed red pepper flakes|240ml heavy cream|30g fresh parsley|100g Parmesan, grated", "method": "Make the orzo: heat olive oil in a large pan. Add the onion and cook until softened. Add garlic and tomato paste and cook for 1–2 minutes.|Add the toasted orzo and pour in the beef stock. Season with salt, pepper, paprika and red pepper flakes. Simmer, stirring occasionally, until the orzo is cooked and liquid is mostly absorbed. Stir in the heavy cream, parsley and Parmesan. Keep warm.|Season the steak pieces with salt, black pepper, onion powder and garlic powder.|Cook on medium-high heat until your preferred doneness.|Add butter, minced garlic and parsley to the pan and toss the steak until well coated.|Serve the steak bites over the creamy tomato orzo.", "rating": null, "cooked": false, "notes": "Source: ReciMe app — ribeye quantity not given; approx. 500g used here for 4 servings."}, {"id": "R023", "name": "Honey Garlic Beef Pasta", "description": "Savoury-sweet beef mince pasta with honey, Worcestershire sauce and a touch of cream", "cookbooks": ["CB03", "CB06"], "tags": ["#beef", "#pasta", "#honey"], "servings": 2, "prepTime": 10, "cookTime": 25, "calories": null, "protein": null, "fat": null, "ingredients": "345g extra lean beef mince|150g dried pasta|1 brown onion, diced|11g garlic paste (2 tsp)|16g tomato purée (1 tbsp)|1 tsp smoked paprika|3g garlic granules (1 tsp)|3g onion granules (1 tsp)|1 tsp oregano|17g Worcestershire sauce (1 tbsp)|200ml vegetable stock|100ml single cream|25g honey|1 tsp red chilli flakes|1 tsp black pepper|12g salt (2 tsp)", "method": "Add the onion to a pan, season with salt and pepper and fry until softened. Add the mince and fry for about 10 minutes. Add the seasonings (paprika, garlic granules, onion granules, oregano) and cook for a few more minutes.|Add the garlic paste, tomato purée and Worcestershire sauce. Stir thoroughly, then add the stock, cream and honey. Allow to simmer. Meanwhile cook the pasta according to packet instructions.|Once the pasta is ready, add to the pan, mix together and serve.", "rating": null, "cooked": false, "notes": ""}, {"id": "R024", "name": "Everything Egg & Pesto Bagel", "description": "Quick air-fryer bagel with a baked egg, green pesto, melted cheddar and everything seasoning", "cookbooks": ["CB01", "CB02", "CB08"], "tags": ["#pesto", "#eggs", "#bagel", "#air-fryer"], "servings": 2, "prepTime": 2, "cookTime": 7, "calories": null, "protein": null, "fat": null, "ingredients": "1 bagel|2 eggs|30g reduced-fat cheddar, grated|16g green pesto (1 tbsp)|salt and pepper|chilli flakes (optional)", "method": "Optionally line your air fryer with baking paper.|Spread the pesto onto each bagel half. Crack an egg onto each half. Sprinkle with chilli flakes, salt and pepper, then top with grated cheddar.|Air fry at 180°C for 6–7 minutes until the egg is set and cheese is melted.", "rating": null, "cooked": false, "notes": ""}, {"id": "R025", "name": "Chorizo Carbonara", "description": "Crispy chorizo carbonara — a quicker, punchier take on the Italian classic", "cookbooks": ["CB03", "CB06"], "tags": ["#chorizo", "#pasta", "#carbonara"], "servings": 2, "prepTime": 5, "cookTime": 20, "calories": null, "protein": null, "fat": null, "ingredients": "150g dried spaghetti|100g chorizo, diced|1 large egg|2 egg yolks|100g Parmesan, grated|fresh parsley|black pepper|50ml pasta water", "method": "Cook the spaghetti in boiling salted water according to packet instructions.|In a bowl, whisk together the egg and 2 yolks. Add the Parmesan and a generous grind of black pepper. Set aside.|Fry the chorizo for a few minutes until crispy. Add the cooked spaghetti to the pan and toss together.|Take the pan off the heat and allow to cool for a couple of minutes. Add the egg and Parmesan mixture and 50ml of pasta water, stirring thoroughly to form a silky sauce. Add fresh parsley and serve.", "rating": null, "cooked": false, "notes": "Original recipe uses JD carbonara seasoning (optional) — omit if unavailable."}, {"id": "R026", "name": "Creamy Garlic Parmesan Chicken Meatballs", "description": "Baked chicken meatballs with hidden veg in a rich garlic Parmesan cream sauce", "cookbooks": ["CB03", "CB06"], "tags": ["#chicken", "#meatballs"], "servings": 5, "prepTime": 15, "cookTime": 31, "calories": null, "protein": null, "fat": null, "ingredients": "For the meatballs: 500g chicken breast mince|1 egg|1 carrot, grated|1 courgette, grated (excess water squeezed)|1 onion, finely diced|3 cloves garlic, minced|15g fresh parsley|1 tsp smoked paprika|1.5 tsp oregano|6g salt (1 tsp)|0.5 tsp black pepper||For the sauce: 6 cloves garlic, minced|1 brown onion, finely diced|80ml white wine|50g Parmesan, grated|480ml whole milk|120ml chicken stock|28g light butter (2 tbsp)|16g plain flour (2 tbsp)|25g fresh parsley, finely chopped|25g fresh chives, finely chopped|30g lemon juice (2 tbsp)|1 tsp smoked paprika|1.5 tsp oregano|6g salt (1 tsp)", "method": "Preheat the air fryer to 190°C. Squeeze the excess water from the courgette. In a large bowl, combine all the meatball ingredients — hands work best. Roll into balls slightly larger than golf balls.|Spray the meatballs lightly with olive oil and arrange in a single layer across both drawers, roughly 8 per drawer. Air fry at 190°C for 14–16 minutes, turning halfway, until golden and cooked through.|Make the sauce: in a large pan over medium heat, sauté the onion with a pinch of salt for 4–5 minutes until soft and golden. Add the garlic and seasonings and cook for 1–2 minutes until fragrant. Deglaze the pan with the white wine and simmer until mostly evaporated.|Add the butter and melt. Sprinkle over the flour and stir to form a roux. Gradually add the milk, stirring continuously until thickened and smooth. Stir in the Parmesan, chives and parsley.|Add the meatballs to the sauce and simmer gently for a minute. Finish with the fresh lemon juice.|Serve over mash and green beans, or with rice or pasta.", "rating": null, "cooked": false, "notes": "AIR FRYER: both drawers on Sync finishes the batch in one go and gives a better crust than the oven did. Cooked through is 74°C in the middle of a meatball. OVEN: preheat to 200°C, place on a lined baking tray, spray with oil and bake for 20 minutes."}, {"id": "R027", "name": "Creamy Paprika Beef Pasta", "description": "Deeply caramelised minced beef in a smoky paprika tomato sauce finished with mascarpone and Parmesan", "cookbooks": ["CB03", "CB06"], "tags": ["#beef", "#pasta"], "servings": 4, "prepTime": 10, "cookTime": 20, "calories": null, "protein": null, "fat": null, "ingredients": "400g rigatoni|1 onion, diced|500g minced beef|4 garlic cloves, minced|7g smoked paprika (1 tbsp)|16g tomato paste (1 tbsp)|400g tin chopped tomatoes|150ml beef stock|150g mascarpone|40g Parmesan, grated|10g fresh parsley, chopped|cooking oil|salt and pepper", "method": "Heat cooking oil in a large pan over medium-high heat. Add the minced beef and spread it out. Leave it to caramelise — once deeply browned underneath, break it up and cook until browned all over.|Add the onion and cook for 4–5 minutes until softened.|Stir in the garlic and smoked paprika and cook for 1 minute.|Add the tomato paste and cook out for another minute to deepen the flavour.|Pour in the chopped tomatoes and beef stock. Stir well and simmer for 10 minutes until thickened and rich.|Meanwhile, cook the pasta in salted boiling water until al dente.|Drain the pasta, keeping back a splash of pasta water. Add the pasta straight into the sauce.|Stir through the mascarpone, grated Parmesan and chopped parsley. Add a splash of pasta water and toss until glossy and silky.|Taste for seasoning, finish with more Parmesan and serve immediately.", "rating": null, "cooked": false, "notes": ""}, {"id": "R028", "name": "Milkybar Biscuit Bars", "description": "No-bake condensed milk and digestive traybake studded with Milkybar chunks under a white chocolate top", "cookbooks": ["CB10", "CB11"], "tags": ["#no-bake", "#chocolate", "#traybake", "#milkybar"], "servings": 16, "prepTime": 20, "cookTime": 0, "calories": null, "protein": null, "carbs": null, "fat": null, "fibre": null, "ingredients": "350g digestive biscuits|100g butter, melted|300g condensed milk|3 Milkybar bars (approx. 75g), chopped||For the topping: 100g Milkybar, melted|1 Milkybar Gold bar, melted (optional)|16g Biscoff spread (1 tbsp), melted, to drizzle (optional)", "method": "Line a 20cm square tray with baking paper. Blitz the digestives in a food processor until fine — a bag and a rolling pin works just as well.|Melt the butter, then mix it into the biscuit crumb along with the condensed milk until evenly combined.|Fold in the chopped Milkybar so you get pockets of white chocolate through the mix rather than it melting away.|Press the mixture firmly and evenly into the lined tray — the back of a spoon or the base of a glass gets it level.|Melt the topping Milkybar and pour over, spreading evenly to the edges. Melt the Gold bar and Biscoff and drizzle over if using.|Chill for at least 2 hours until firm, then lift out and cut into 16 bars.", "rating": null, "cooked": false, "notes": "No-bake, so any tray works — a 20cm square gives 16 sensible bars. Keeps in an airtight container in the fridge for up to a week."}, {"id": "R029", "name": "Mortadella & Egg Sandwich", "description": "Whisked microwave egg with mayo, seared mortadella and melted cheese in a toasted brioche bun", "cookbooks": ["CB05", "CB01", "CB02"], "tags": ["#sandwich", "#eggs", "#pork", "#mortadella", "#quick"], "servings": 1, "prepTime": 5, "cookTime": 5, "calories": null, "protein": null, "carbs": null, "fat": null, "fibre": null, "ingredients": "2 eggs|14g mayonnaise (1 tbsp)|60g mortadella (approx. 3 slices)|1 slice burger-style cheese|1 brioche bun|salt and pepper", "method": "Crack the eggs into a microwave-safe bowl, add the mayonnaise and whisk thoroughly. Season with salt and pepper.|Microwave on high for 50–60 seconds until just set — stop while it still looks slightly glossy, it carries on cooking in the bowl.|Meanwhile, sear the mortadella in a dry pan for 1 minute each side until it starts to crisp and curl.|Lay the cheese over the mortadella and cover the pan for 30 seconds to melt.|Toast the brioche bun cut-side down in the same pan. Build the sandwich — mortadella and cheese first, then the egg on top.", "rating": null, "cooked": false, "notes": "Microwave wattages vary, so check the egg at 40 seconds. A burger-style slice melts best, but Emmental or cheddar both work."}, {"id": "R030", "name": "Snickers Bark", "description": "Three-layer freezer bark of flattened Medjool dates, peanut butter and dark chocolate", "cookbooks": ["CB10", "CB08"], "tags": ["#no-bake", "#dates", "#chocolate", "#peanut-butter"], "servings": 8, "prepTime": 15, "cookTime": 0, "calories": null, "protein": null, "carbs": null, "fat": null, "fibre": null, "ingredients": "10 Medjool dates (approx. 240g)|85g peanut butter|90g dark chocolate|flaky sea salt, to finish (optional)", "method": "Pit the dates and place them in a ziplock bag. Flatten with the base of a glass until they form one even layer.|Spoon the peanut butter over the dates. Seal the bag and use your hands to spread it evenly across the layer.|Melt the chocolate in a bowl set over a saucepan holding 5cm of gently simmering water, stirring until smooth.|Spoon the melted chocolate over the peanut butter layer. Seal the bag again and even it out with your hands.|Chill until fully set, then break into pieces. Finish with a pinch of flaky sea salt if you like.", "rating": null, "cooked": false, "notes": "Converted from cups — ⅓ cup peanut butter ≈ 85g, ½ cup dark chocolate ≈ 90g. Store in the fridge or freezer; very good straight from frozen."}, {"id": "R031", "name": "Chicken Bouillon Base", "description": "Homemade chicken-style seasoning blend — the shop-bought boxed rice flavouring, made from scratch", "cookbooks": ["CB12"], "tags": ["#seasoning", "#basics", "#store-cupboard", "#homemade"], "servings": 18, "prepTime": 5, "cookTime": 0, "calories": null, "protein": null, "carbs": null, "fat": null, "fibre": null, "ingredients": "60g nutritional yeast (½ cup)|22g onion powder (3 tbsp)|18g garlic powder (2 tbsp)|7g dried parsley (2 tbsp)|6g celery seed (1 tbsp) (or 2 tbsp celery powder)|12g fine sea salt (2 tsp)|5g ground white pepper (2 tsp)|6g ground turmeric (2 tsp)|1 tsp smoked paprika|0.5 tsp ground thyme|0.5 tsp rubbed sage|0.25 tsp ground rosemary", "method": "Combine all the ingredients in a bowl and whisk thoroughly so the nutritional yeast is evenly distributed.|For a finer, more even blend, pulse briefly in a spice grinder or small food processor.|Store in an airtight jar. The batch makes roughly 18 tbsp.|To use: 1 tbsp per 200g (1 cup) of dry rice — see Chicken Flavoured Rice.", "rating": null, "cooked": false, "notes": "Servings are counted in tablespoons, so the servings control scales the batch directly. Alternative storage: pre-portion into jars with the rice already measured in (rice and seasoning only, nothing else) for the same grab-and-go convenience as the shop-bought boxes."}, {"id": "R032", "name": "Chicken Flavoured Rice", "description": "Store-cupboard rice cooked in homemade chicken bouillon and butter — the boxed stuff, without the box", "cookbooks": ["CB03", "CB12"], "tags": ["#rice", "#side", "#basics", "#one-pan"], "servings": 4, "prepTime": 2, "cookTime": 20, "calories": null, "protein": null, "carbs": null, "fat": null, "fibre": null, "ingredients": "200g white rice (1 cup)|6g Chicken Bouillon Base (1 tbsp) (see separate recipe)|480ml water or chicken stock (2 cups)|14g butter (1 tbsp)", "method": "Add the rice, bouillon base, water or stock and butter to a saucepan and stir once.|Bring to the boil, then reduce to the lowest heat and cover.|Cook for 15–18 minutes until the liquid is absorbed and the rice is tender.|Take off the heat and leave covered for 5 minutes, then fluff with a fork.", "rating": null, "cooked": false, "notes": "Ratio to scale by: 1 cup rice : 1 tbsp seasoning : 2 cups liquid : 1 tbsp butter. Note the servings control only adjusts the leading number on each line, so the cup equivalents in brackets won't move."}, {"id": "R033", "name": "Gut Boosting Berry Jam", "description": "Blender jam of mixed berries, milled chia and honey — no cooking, no setting sugar", "cookbooks": ["CB01", "CB10"], "tags": ["#jam", "#fibre", "#no-cook", "#berries"], "servings": 8, "prepTime": 5, "cookTime": 0, "calories": null, "protein": null, "carbs": null, "fat": null, "fibre": null, "ingredients": "100g mixed berries (frozen, defrosted)|24g chia seeds (2 tbsp), milled|3g psyllium husk powder (1 tsp)|50ml water, plus more as needed|42g honey (2 tbsp)", "method": "Defrost the berries fully, keeping any juice that comes out of them.|Place all the ingredients in a blender and blend to combine.|Add more water a splash at a time until it reaches the consistency you want — it will thicken further as it sits.|Decant into a jar and refrigerate. Keeps for up to 1 week.", "rating": null, "cooked": false, "notes": "Original version, containing chia. A chia-free version using psyllium husk only is saved separately. It thickens noticeably in the first hour, so err on the loose side when blending."}, {"id": "R034", "name": "Gut Boosting Berry Jam (Chia-Free)", "description": "The same blender berry jam, thickened with psyllium husk alone instead of chia", "cookbooks": ["CB01", "CB10"], "tags": ["#jam", "#fibre", "#no-cook", "#berries", "#psyllium"], "servings": 8, "prepTime": 5, "cookTime": 0, "calories": null, "protein": null, "carbs": null, "fat": null, "fibre": null, "ingredients": "100g mixed berries (frozen, defrosted)|6g psyllium husk powder (2 tsp)|80ml water, plus more as needed|42g honey (2 tbsp)", "method": "Defrost the berries fully, keeping any juice that comes out of them.|Blend the berries, water and honey until smooth.|Add the psyllium husk powder and blend briefly to combine — a few seconds is plenty, it starts gelling straight away.|Decant into a jar before it sets and refrigerate. Keeps for up to 1 week.", "rating": null, "cooked": false, "notes": "Chia-free version. Psyllium powder thickens much harder than chia, so 2 tsp of powder replaces both the 2 tbsp of milled chia and the original 1 tsp of husk. Blend it in last and jar it quickly, or you'll be scraping it out of the blender. Loosen with a splash of water if it sets firmer than you want."}, {"id": "R035", "name": "Cheesy Taco Rice", "description": "One-pan beef mince and rice in taco seasoning and beef stock, finished with melted cheddar", "cookbooks": ["CB03", "CB08"], "tags": ["#beef", "#rice", "#taco", "#one-pan", "#quick"], "servings": 3, "prepTime": 10, "cookTime": 25, "calories": null, "protein": null, "carbs": null, "fat": null, "fibre": null, "ingredients": "500g lean beef mince|30g taco seasoning (1 sachet)|30g tomato purée|300g white rice|750ml beef stock|70g reduced-fat cheddar, grated|4g oil (1 tsp)|salt and pepper", "method": "Heat the oil in a large, deep pan over a medium-high heat. Add the beef mince, spread it out and leave it to brown before breaking it up.|Stir in the taco seasoning and tomato purée and cook out for 1–2 minutes.|Add the rice and stir to coat, then pour in the beef stock and bring to the boil.|Reduce to a simmer, cover and cook for 10–15 minutes until the rice is tender and most of the liquid has gone. Stir occasionally so it doesn't catch.|Take off the heat, scatter over the grated cheddar and cover for 2 minutes to melt. Stir through and season to taste.", "rating": null, "cooked": false, "notes": "The original method gave a flat 10-minute simmer, but 300g of dry rice in 750ml of stock usually needs closer to 15 minutes with the lid on. Check as you go and add a splash of water if it dries out early."}, {"id": "R036", "name": "Simple Husk Jelly", "description": "Two-ingredient fruit juice jelly set with psyllium husk powder — no gelatine, no heat", "cookbooks": ["CB10", "CB08"], "tags": ["#fibre", "#no-cook", "#psyllium", "#quick"], "servings": 1, "prepTime": 5, "cookTime": 0, "calories": null, "protein": null, "carbs": null, "fat": null, "fibre": null, "ingredients": "150ml fruit juice|6g psyllium husk powder (2 tsp)", "method": "Pour the juice into a jar.|Add the psyllium husk powder and stir or shake immediately and vigorously — powder gels within seconds and will clump if you're slow off the mark.|Leave to set for 15–20 minutes at room temperature, or chill for a firmer result.", "rating": null, "cooked": false, "notes": "Adjusted for powder. The original called for 3 tbsp of whole husk to 150ml of juice, which works out at roughly 15g of fibre in one serving — very dense, and a lot to take in one go. 2 tsp of powder (~6g) gives a soft set; use 3 tsp if you want it firmer. Drink a full glass of water alongside it, and build up gradually if psyllium is new to you."}, {"id": "R037", "name": "Honey Oat Porridge with Psyllium Husk", "description": "Three-minute microwave honey porridge with a psyllium fibre boost and a blueberry purée swirl", "cookbooks": ["CB01"], "tags": ["#oats", "#breakfast", "#fibre", "#psyllium", "#microwave", "#quick"], "servings": 1, "prepTime": 2, "cookTime": 4, "calories": 415, "protein": 17, "carbs": 66, "fat": 9, "fibre": 9, "ingredients": "50g rolled oats|300ml semi-skimmed milk|40g blueberries|21g honey (1 tbsp)|0.5 tsp psyllium husk powder", "method": "Blitz the blueberries to a smooth purée with a splash of water using a stick blender. Set aside.|Combine the oats and milk in a large microwave-safe bowl — use a bigger one than you think you need, it climbs the sides as it bubbles.|Microwave on high for 2 minutes, stir well, then a further 1–1.5 minutes until thickened. Stir again and stand for a minute.|Stir in the honey.|Stir the psyllium husk powder through fast — it thickens within seconds.|Swirl the blueberry purée through and serve.", "rating": null, "cooked": false, "notes": "Eat promptly — psyllium keeps absorbing liquid the longer it sits. Blueberries are blended to a purée and swirled through rather than left whole. Husk quantity adjusted for powder (½ tsp powder in place of 1 tsp whole husk). Microwave wattages vary, so check it at 2 minutes and go in 30-second bursts from there. HOB: combine the oats and milk in a saucepan and simmer for 5–6 minutes, stirring, until thickened, then pick up from step 4."}, {"id": "R038", "name": "Overnight Oats with Greek Yoghurt & Almond Butter", "description": "Fridge-set oats with Greek yoghurt, almond butter and a blueberry purée ripple", "cookbooks": ["CB01", "CB08"], "tags": ["#oats", "#breakfast", "#overnight", "#no-cook", "#fibre"], "servings": 1, "prepTime": 10, "cookTime": 0, "calories": 434, "protein": 22, "carbs": 43, "fat": 20, "fibre": 10, "ingredients": "40g rolled oats|150ml semi-skimmed milk|100g Greek yoghurt|40g blueberries|16g almond butter (1 tbsp)|0.5 tsp psyllium husk powder", "method": "Blitz the blueberries to a smooth purée with a stick blender or mini processor.|Combine the oats, milk, Greek yoghurt, almond butter and psyllium husk powder in a jar or bowl and mix well.|Ripple the blueberry purée through the mix.|Cover and chill overnight.|Stir and serve.", "rating": null, "cooked": false, "notes": "No cooking needed — this one's a fridge job, so there's no hob or microwave version to give. Blueberries blended to a purée and rippled through rather than left whole. Husk quantity adjusted for powder."}, {"id": "R039", "name": "Vanilla Protein Oats", "description": "Quick microwave porridge stirred through with vanilla protein powder and a blueberry purée swirl", "cookbooks": ["CB01", "CB09"], "tags": ["#oats", "#breakfast", "#protein", "#fibre", "#microwave", "#quick"], "servings": 1, "prepTime": 2, "cookTime": 3, "calories": 405, "protein": 36, "carbs": 47, "fat": 8, "fibre": 8.5, "ingredients": "40g rolled oats|200ml semi-skimmed milk|1 scoop vanilla protein powder|40g blueberries|0.5 tsp psyllium husk powder|7g honey (1 tsp) (optional)", "method": "Blitz the blueberries to a smooth purée and set aside.|Combine the oats and milk in a large microwave-safe bowl — it rises as it cooks, so give it room.|Microwave on high for 2 minutes, stir well, then a further 1 minute until thickened.|Let it stand for 1–2 minutes to cool slightly — too hot and the protein powder turns grainy.|Stir in the protein powder and the psyllium husk powder.|Swirl through the blueberry purée, add the honey if using, and serve.", "rating": null, "cooked": false, "notes": "Protein powder values vary a little by brand — check your label if you want the macros exact. Blueberries blended rather than whole. Husk adjusted for powder. The standing minute before the protein powder goes in is the difference between smooth and grainy. HOB: cook the oats and milk in a saucepan for 5 minutes until thickened, take off the heat and pick up from step 4."}, {"id": "R040", "name": "Pesto Chicken Pasta", "description": "Three-ingredient weeknight pasta — seared chicken breast tossed through pesto", "cookbooks": ["CB03", "CB08"], "tags": ["#chicken", "#pasta", "#pesto", "#quick"], "servings": 1, "prepTime": 5, "cookTime": 12, "calories": 540, "protein": null, "carbs": null, "fat": null, "fibre": null, "ingredients": "75g dried pasta|120g chicken breast, sliced|32g pesto (2 tbsp)|4g olive oil (1 tsp)|salt and pepper", "method": "Bring a pan of salted water to the boil and cook the pasta for 8–10 minutes until al dente.|Meanwhile, heat the olive oil in a frying pan and fry the sliced chicken for 6–8 minutes until cooked through.|Drain the pasta, keeping back a splash of the water. Add it to the chicken with the pesto and toss to combine, loosening with pasta water.|Season and serve.", "rating": null, "cooked": false, "notes": "Calorie figure is a rough estimate. The pasta and chicken cook side by side rather than one after the other. Thaw the chicken fully in the fridge overnight if it's frozen."}, {"id": "R041", "name": "Garlic Cream Cheese Bagel with Everything Seasoning", "description": "Toasted bagel, garlic and herb cream cheese and a heavy hand with the everything seasoning", "cookbooks": ["CB01", "CB08"], "tags": ["#bagel", "#breakfast", "#quick", "#no-cook"], "servings": 1, "prepTime": 2, "cookTime": 3, "calories": null, "protein": null, "carbs": null, "fat": null, "fibre": null, "ingredients": "1 bagel|30g garlic & herb cream cheese (2 tbsp)|3g everything bagel seasoning (1 tsp)", "method": "Slice and toast the bagel.|Spread the garlic and herb cream cheese over both halves.|Sprinkle over the everything bagel seasoning and serve.", "rating": null, "cooked": false, "notes": "Everything bagel seasoning is stocked by Tesco, Sainsbury's, Asda and M&S. To make your own, use equal parts poppy seeds, sesame seeds, dried minced garlic, dried minced onion and flaky sea salt."}, {"id": "R042", "name": "Tomato Salmon Udon Noodles", "description": "Seared salmon fillet over udon noodles folded through a warm pomodoro sauce", "cookbooks": ["CB03", "CB06"], "tags": ["#salmon", "#noodles", "#udon", "#quick"], "servings": 1, "prepTime": 5, "cookTime": 15, "calories": null, "protein": null, "carbs": null, "fat": null, "fibre": null, "ingredients": "140g salmon fillet|150g udon noodles|150g pomodoro sauce|4g olive oil (1 tsp)|pinch of chilli flakes (optional)", "method": "Heat the olive oil in a pan and sear the salmon skin-side down for 4–5 minutes.|Flip and finish for another 2–3 minutes, then set aside to rest.|Boil the udon noodles according to the packet instructions and drain.|Warm the pomodoro sauce in a pan and toss the noodles through it.|Plate the noodles and top with the salmon and a pinch of chilli flakes.", "rating": null, "cooked": false, "notes": "Salmon is done when the flesh turns from translucent to an even pale pink and flakes apart easily with a fork — a very slightly translucent centre is fine, it keeps cooking a little as it rests. The noodles are cooked separately, then folded through the warmed sauce."}, {"id": "R043", "name": "Vimto & Psyllium Husk Jelly", "description": "Fibre-boosting Vimto jelly set with psyllium husk — a snack rather than a meal", "cookbooks": ["CB10", "CB08"], "tags": ["#fibre", "#no-cook", "#psyllium", "#vimto"], "servings": 1, "prepTime": 5, "cookTime": 0, "calories": null, "protein": null, "carbs": null, "fat": null, "fibre": null, "ingredients": "200ml Vimto, prepared and diluted|3g psyllium husk powder (1 tsp)", "method": "Dilute the Vimto to drinking strength and pour 200ml into a jar or bowl.|Whisk in the psyllium husk powder fast — powder gels within seconds and will clump if you're slow.|Chill for 1–2 hour // PERSISTENCE (localStorage)
// ════════════════════════════════════════════════════════════
// Bump SEED_VERSION whenever new recipes are baked into this file.
// On load, any seed recipe whose ID isn't already saved gets merged in,
// so file updates reach the browser without wiping local edits.
const SEED_VERSION = 4;
const STORE_KEY = 'atoalh.recipeDatabase';

let COOKBOOKS = [];
let db = [];
let storageOK = true;

const clone = o => JSON.parse(JSON.stringify(o));

function loadStore(){
  let merged = 0, refreshed = 0;
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw){
      COOKBOOKS = clone(SEED_COOKBOOKS);
      db = clone(SEED_RECIPES);
      saveStore();
      return {merged:0, refreshed:0, fresh:true};
    }
    const s = JSON.parse(raw);
    COOKBOOKS = Array.isArray(s.cookbooks) && s.cookbooks.length ? s.cookbooks : clone(SEED_COOKBOOKS);
    db        = Array.isArray(s.recipes)   && s.recipes.length   ? s.recipes   : clone(SEED_RECIPES);
    if((s.seedVersion||0) < SEED_VERSION){
      SEED_COOKBOOKS.forEach(cb=>{ if(!COOKBOOKS.some(c=>c.id===cb.id)) COOKBOOKS.push(clone(cb)); });
      SEED_RECIPES.forEach(seed=>{
        const i = db.findIndex(x=>x.id===seed.id);
        if(i < 0){ db.push(clone(seed)); merged++; }
        else if(!db[i].edited){
          const {rating, cooked} = db[i];
          db[i] = Object.assign(clone(seed), {rating, cooked});
          refreshed++;
        }
      });
      saveStore();
    }
  } catch(err) {
    console.warn('Recipe storage unavailable, running from file defaults:', err);
    storageOK = false;
    COOKBOOKS = clone(SEED_COOKBOOKS);
    db = clone(SEED_RECIPES);
  }
  return {merged, refreshed, fresh:false};
}

function saveStore(){
  if(!storageOK) return;
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      seedVersion: SEED_VERSION,
      savedAt: new Date().toISOString(),
      cookbooks: COOKBOOKS,
      recipes: db,
    }));
  } catch(err) {
    storageOK = false;
    console.warn('Could not save recipes:', err);
    showToast('Could not save — changes are session-only');
  }
  renderStorageStatus();
}

function renderStorageStatus(){
  const el = document.getElementById('storage-status');
  if(!el) return;
  el.innerHTML = storageOK
    ? `Recipe set v${SEED_VERSION} &middot; saved on this device &middot; <a href="#" onclick="resetStore();return false;">Reset to file defaults</a>`
    : `Recipe set v${SEED_VERSION} &middot; <span style="color:#c98a5a">storage unavailable — changes won't persist</span>`;
}

function resetStore(){
  if(!confirm('Reset to the recipes built into this file?\n\nAny recipes, ratings or cookbooks you added in the browser will be lost. Export a CSV first if you want a backup.')) return;
  try { localStorage.removeItem(STORE_KEY); } catch(err) {}
  COOKBOOKS = clone(SEED_COOKBOOKS);
  db = clone(SEED_RECIPES);
  saveStore();
  renderCookbookFilters();
  renderGrid();
  showToast('Reset to file defaults');
}

// STATE
// ════════════════════════════════════════════════════════════
const VIEW_KEY = 'atoalh.recipeView';

const SORTS = [
  {id:'name',     label:'A–Z',                fn:(a,b)=>byName(a,b)},
  {id:'added',    label:'Recently added',     fn:(a,b)=>idNum(b)-idNum(a)},
  {id:'quickest', label:'Quickest first',     fn:(a,b)=>(totalTime(a)||9999)-(totalTime(b)||9999)||byName(a,b)},
  {id:'rating',   label:'Highest rated',      fn:(a,b)=>(b.rating||0)-(a.rating||0)||byName(a,b)},
  {id:'fewest',   label:'Fewest ingredients', fn:(a,b)=>ingCount(a)-ingCount(b)||byName(a,b)},
];
const GROUPS = [{id:'cookbook',label:'Cookbook'},{id:'none',label:'None'}];

function byName(a,b){ return a.name.replace(/^["']/,'').localeCompare(b.name.replace(/^["']/,''),'en-GB'); }
function idNum(r){ return parseInt(String(r.id).replace(/\D/g,''))||0; }

function loadView(){
  try{
    const v = JSON.parse(localStorage.getItem(VIEW_KEY)||'{}');
    if(SORTS.some(s=>s.id===v.sortBy)) state.sortBy=v.sortBy;
    if(GROUPS.some(g=>g.id===v.groupBy)) state.groupBy=v.groupBy;
    if(['all','cooked','uncooked'].includes(v.filterCooked)) state.filterCooked=v.filterCooked;
    if(Array.isArray(v.filterCookbooks)) state.filterCookbooks=v.filterCookbooks.filter(id=>COOKBOOKS.some(c=>c.id===id));
  }catch(err){}
}

function saveView(){
  try{
    localStorage.setItem(VIEW_KEY, JSON.stringify({
      sortBy:state.sortBy, groupBy:state.groupBy,
      filterCooked:state.filterCooked, filterCookbooks:state.filterCookbooks,
    }));
  }catch(err){}
}

let state = {
  filterCookbooks: [],
  filterCooked: 'all',
  sortBy: 'name',
  groupBy: 'cookbook',
  currentRecipeId: null,
  currentServings: 2,
  editingId: null,
  editRating: 0,
};

// ════════════════════════════════════════════════════════════
// UTILS
// ════════════════════════════════════════════════════════════
function getCookbook(id){ return COOKBOOKS.find(c=>c.id===id)||{name:id,colour:'#999'}; }

function parseFraction(s){
  s = s.trim();
  const m = s.match(/^(\d+)\s+(\d+)\/(\d+)$/);
  if(m) return +m[1] + +m[2]/+m[3];
  const f = s.match(/^(\d+)\/(\d+)$/);
  if(f) return +f[1]/+f[2];
  return parseFloat(s)||0;
}

function formatNum(n){
  if(n<=0) return '0';
  const fracs=[[0.25,'¼'],[0.33,'⅓'],[0.5,'½'],[0.67,'⅔'],[0.75,'¾']];
  const int=Math.floor(n), fr=n-int;
  for(const [v,sym] of fracs) if(Math.abs(fr-v)<0.06) return int>0?`${int}${sym}`:sym;
  return Math.abs(n-Math.round(n))<0.05 ? String(Math.round(n)) : n.toFixed(1);
}

function scaleIngredient(text, ratio){
  if(ratio===1) return text;
  // The bracketed spoon equivalent only holds at the written serving size
  text = text.replace(/\s\((?:\d+(?:\.\d+)?(?:\/\d+)?)\s(?:tbsp|tsp)\)/g, '');
  // Match leading: "1 1/2", "1/2", "0.5", "300", "4–5"
  return text.replace(/^(\d+(?:\s+\d+\/\d+|\.\d+|\/\d+)?)(\s*[–-]\s*(\d+(?:\.\d+)?))?/, (_, n1, rng, n2)=>{
    const v1 = parseFraction(n1)*ratio;
    if(rng && n2) return `${formatNum(v1)}–${formatNum(parseFloat(n2)*ratio)}`;
    return formatNum(v1);
  });
}

function parseIngredients(str){
  const items = str.split('|');
  const sections=[];
  let cur={header:null, items:[]};
  for(const item of items){
    if(item===''){
      if(cur.items.length) sections.push(cur);
      cur={header:null,items:[]};
    } else {
      const hm = item.match(/^((?:For (?:the )?|To assemble)[^:]+):\s*(.+)$/i);
      if(hm){ cur.header=hm[1]; cur.items.push(hm[2]); }
      else cur.items.push(item);
    }
  }
  if(cur.items.length) sections.push(cur);
  return sections;
}

function renderStars(rating, max=5){
  if(!rating) return '';
  let s='';
  for(let i=1;i<=max;i++) s+=`<span class="star">${i<=rating?'★':'☆'}</span>`;
  return s;
}

function totalTime(r){ return (r.prepTime||0)+(r.cookTime||0); }
function ingCount(r){ return r.ingredients.split('|').filter(i=>i.trim()&&!i.match(/^(For |To assemble)/i)).length; }

function nextId(){
  const nums = db.map(r=>parseInt(r.id.replace('R',''))||0);
  return 'R'+String(Math.max(0,...nums)+1).padStart(3,'0');
}

function allTags(){
  const s=new Set();
  db.forEach(r=>r.tags.forEach(t=>s.add(t)));
  return [...s].sort();
}

// ════════════════════════════════════════════════════════════
// FILTER + SEARCH
// ════════════════════════════════════════════════════════════
function getFilteredRecipes(){
  const search = document.getElementById('search').value.toLowerCase().trim();
  return db.filter(r=>{
    if(state.filterCookbooks.length && !state.filterCookbooks.some(cb=>r.cookbooks.includes(cb))) return false;
    if(state.filterCooked==='cooked' && !r.cooked) return false;
    if(state.filterCooked==='uncooked' && r.cooked) return false;
    if(search){
      const hay = (r.name+' '+r.description+' '+r.tags.join(' ')+' '+r.notes+' '+r.ingredients).toLowerCase();
      if(!hay.includes(search)) return false;
    }
    return true;
  });
}

function applyFilters(){ renderGrid(); }

function setCookedFilter(val){
  state.filterCooked=val;
  saveView();
  renderCookbookFilters();
  renderGrid();
}

// ════════════════════════════════════════════════════════════
// RENDER
// ════════════════════════════════════════════════════════════
function cookbookPillsHtml(){
  return COOKBOOKS.map(cb=>{
    const on=state.filterCookbooks.includes(cb.id);
    return `<button class="filter-pill ${on?'active':''}"
      style="${on?`background:${cb.colour};border-color:${cb.colour};color:#12140f`:'color:var(--muted)'}"
      onclick="toggleCbFilter('${cb.id}')">${cb.name}</button>`;
  }).join('');
}

function groupPillsHtml(){
  return GROUPS.map(g=>{
    const on=state.groupBy===g.id;
    return `<button class="filter-pill ${on?'active':''}"
      style="${on?'background:var(--accent);border-color:var(--accent);color:#12140f':'color:var(--muted)'}"
      onclick="setGroupBy('${g.id}')">${g.label}</button>`;
  }).join('');
}

function cookedToggleHtml(){
  const opts=[['all','All'],['cooked','✓ Cooked'],['uncooked','★ To Try']];
  return opts.map(([v,l])=>
    `<button class="${state.filterCooked===v?'active':''}" onclick="setCookedFilter('${v}')">${l}</button>`
  ).join('');
}

function renderCookbookFilters(){
  const set=(id,html)=>{ const el=document.getElementById(id); if(el) el.innerHTML=html; };
  set('cb-filters', cookbookPillsHtml());
  set('cb-filters-sheet', cookbookPillsHtml());
  set('group-pills', groupPillsHtml());
  set('group-pills-sheet', groupPillsHtml());
  set('cooked-toggle-desktop', cookedToggleHtml());
  set('cooked-toggle-sheet', cookedToggleHtml());
  const sel=document.getElementById('sort-select');
  if(sel) sel.innerHTML=SORTS.map(s=>`<option value="${s.id}" ${state.sortBy===s.id?'selected':''}>${s.label}</option>`).join('');
  const badge=document.getElementById('filter-count-badge');
  if(badge){
    const n=state.filterCookbooks.length+(state.filterCooked!=='all'?1:0);
    badge.textContent=n||'';
    badge.classList.toggle('show', n>0);
  }
}

function openFilterSheet(){
  renderCookbookFilters();
  document.getElementById('filter-overlay').classList.remove('hidden');
  document.body.style.overflow='hidden';
}

function clearFilters(){
  state.filterCookbooks=[];
  state.filterCooked='all';
  saveView();
  renderCookbookFilters();
  renderGrid();
}

function setGroupBy(id){
  state.groupBy=id;
  saveView();
  renderCookbookFilters();
  renderGrid();
}

function setSort(id){
  if(!SORTS.some(s=>s.id===id)) return;
  state.sortBy=id;
  saveView();
  renderCookbookFilters();
  renderGrid();
}

function toggleCbFilter(id){
  const i=state.filterCookbooks.indexOf(id);
  if(i===-1) state.filterCookbooks.push(id); else state.filterCookbooks.splice(i,1);
  saveView();
  renderCookbookFilters();
  renderGrid();
}

function sortRecipes(list){
  const s=SORTS.find(x=>x.id===state.sortBy)||SORTS[0];
  return [...list].sort(s.fn);
}

function buildGroups(recipes){
  if(state.groupBy!=='cookbook') return [{id:null, items:sortRecipes(recipes)}];
  const groups=[];
  for(const cb of COOKBOOKS){
    if(state.filterCookbooks.length && !state.filterCookbooks.includes(cb.id)) continue;
    const items=recipes.filter(r=>r.cookbooks.includes(cb.id));
    if(items.length) groups.push({id:cb.id, name:cb.name, colour:cb.colour, items:sortRecipes(items)});
  }
  const known=new Set(COOKBOOKS.map(c=>c.id));
  const orphans=recipes.filter(r=>!r.cookbooks.some(id=>known.has(id)));
  if(orphans.length && !state.filterCookbooks.length){
    groups.push({id:'__none', name:'Uncategorised', colour:'#586860', items:sortRecipes(orphans)});
  }
  return groups;
}

function renderGrid(){
  const recipes=getFilteredRecipes();
  const grid=document.getElementById('recipe-grid');
  const count=document.getElementById('results-count');
  if(count) count.textContent=`${recipes.length} recipe${recipes.length!==1?'s':''}`;
  if(!recipes.length){
    grid.innerHTML=`<div class="empty-state"><div class="big">🍽</div><p>No recipes match your filters.</p></div>`;
    return;
  }
  grid.innerHTML=buildGroups(recipes).map(g=>{
    const cards=g.items.map(r=>renderCard(r,g)).join('');
    if(!g.name) return `<div class="group-cards">${cards}</div>`;
    return `<section class="group">
      <div class="group-head">
        <span class="group-dot" style="background:${g.colour}"></span>
        <span class="group-name">${g.name}</span>
        <span class="group-count">${g.items.length}</span>
        <span class="group-rule"></span>
      </div>
      <div class="group-cards">${cards}</div>
    </section>`;
  }).join('');
}

function renderCard(r, group){
  const topCb = r.cookbooks[0] ? getCookbook(r.cookbooks[0]) : null;
  const borderColor = (group && group.colour) || (topCb ? topCb.colour : 'var(--border)');
  const otherCbs = r.cookbooks.filter(id=>!group || id!==group.id);
  const badges = otherCbs.slice(0,3).map(id=>{
    const cb=getCookbook(id);
    return `<span class="cb-badge" style="background:${cb.colour}">${cb.name}</span>`;
  }).join('');
  const tags = r.tags.slice(0,5).map(t=>`<span class="tag">${t}</span>`).join('');
  const tt = totalTime(r);
  const ic = ingCount(r);
  const macroHtml = hasMacros(r) ? `<div class="macros">
    ${r.calories?`<div class="macro"><span>${r.calories}</span>kcal</div>`:''}
    ${r.protein?`<div class="macro"><span>${r.protein}g</span> P</div>`:''}
    ${r.carbs?`<div class="macro"><span>${r.carbs}g</span> C</div>`:''}
    ${r.fat?`<div class="macro"><span>${r.fat}g</span> F</div>`:''}
  </div>` : '<div></div>';
  const statusHtml = r.cooked
    ? `<div style="display:flex;align-items:center;gap:4px">${renderStars(r.rating)||'<span class="cooked-badge">Cooked ✓</span>'}</div>`
    : `<span class="want-badge">Want to Try</span>`;
  const inlineStatus = r.cooked
    ? `<span style="color:var(--accent2)">${renderStars(r.rating)||'Cooked ✓'}</span>`
    : `<span style="color:#a8b4e8">To try</span>`;

  return `<div class="card" style="border-top-color:${borderColor};--cb:${borderColor}" onclick="openRecipe('${r.id}')">
    <div class="card-badges">${badges}</div>
    <div class="card-body">
      <div class="card-name">${r.name}</div>
      <div class="card-desc">${r.description}</div>
      <div class="card-tags">${tags}</div>
      <div class="card-stats">
        <div class="stat"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>${tt?tt+' min':'—'}</div>
        <div class="stat"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/></svg>${ic} ingr.</div>
        <div class="stat"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>${r.servings} serving${r.servings!==1?'s':''}</div>
        <div class="stat stat-status">${inlineStatus}</div>
      </div>
    </div>
    <div class="card-footer">${macroHtml}${statusHtml}</div>
  </div>`;
}
