<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATO — Spending Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
  --bg: #0c0e0d; --card: #141714; --card2: #1c201c;
  --border: #222822; --border2: #2e362e;
  --text: #dde6df; --muted: #586860; --muted2: #3a4440;
  --amber: #f0b429; --amber-light: rgba(240,180,41,0.09); --amber-dark: #e6a800;
  --green: #3ddc84; --green-light: rgba(61,220,132,0.08); --green-dark: #2ecc70;
  --red: #ff5757; --red-light: rgba(255,87,87,0.08);
  --accent: #e6b800;
}
  body { font-family: 'DM Mono', monospace; background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px 16px 48px; }
  .container { max-width: 400px; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 28px; }
  header .cycle { margin-left: auto; }
  .name { font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
  .name span { color: var(--accent); }
  .cycle { font-size: 12px; color: var(--muted); }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 12px; }
  .card-label { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 5px; }
  .input-wrap { position: relative; display: flex; align-items: center; }
  .pound { position: absolute; left: 13px; font-size: 16px; font-weight: 600; color: var(--muted); pointer-events: none; }
  .input-wrap input { width: 100%; padding: 11px 44px 11px 28px; font-size: 18px; font-weight: 600; font-family: inherit; border: 1.5px solid var(--border); border-radius: 10px; background: var(--card2); color: var(--text); -webkit-appearance: none; appearance: none; transition: border-color 0.15s; }
  .input-wrap input:focus { outline: none; border-color: var(--accent); }
  .input-wrap input.spends-input:focus { border-color: var(--amber); }
  .input-wrap input.note-input { padding: 11px 13px; font-size: 14px; font-weight: 400; }
  .saved-tag { position: absolute; right: 10px; font-size: 10px; color: var(--muted); background: var(--card2); border: none; border-radius: 4px; padding: 2px 6px; pointer-events: none; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .result-card { border-radius: 14px; padding: 22px 20px; margin-bottom: 12px; }
  .result-card.empty    { background: var(--card); border: 1px solid var(--border); }
  .result-card.positive { background: rgba(61,220,132,0.07); border: 1px solid rgba(61,220,132,0.25); }
  .result-card.warning  { background: rgba(240,180,41,0.07); border: 1px solid rgba(240,180,41,0.25); }
  .result-card.negative { background: rgba(255,87,87,0.07);  border: 1px solid rgba(255,87,87,0.25); }
  .result-label { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: 4px; }
  .result-amount { font-size: 44px; font-weight: 800; letter-spacing: -1.5px; line-height: 1; }
  .result-context { font-size: 12px; margin-top: 8px; }
  .empty .result-label { color: var(--muted); }
  .empty .result-amount { color: var(--muted2); }
  .empty .result-context { color: var(--muted); }
  .positive .result-label, .positive .result-amount, .positive .result-context { color: var(--green); }
  .warning  .result-label, .warning  .result-amount, .warning  .result-context { color: var(--amber); }
  .negative .result-label, .negative .result-amount, .negative .result-context { color: var(--red); }

  .reset-btn { width: 100%; padding: 12px; background: transparent; border: 1px solid var(--border); border-radius: 10px; font-family: inherit; font-size: 13px; color: var(--muted); cursor: pointer; margin-top: 4px; transition: background 0.15s; }
  .reset-btn:hover { background: var(--card2); color: var(--text); }
  .footer { text-align: center; font-size: 11px; color: var(--muted); margin-top: 24px; }

  .section-divider { display: flex; align-items: center; gap: 10px; margin: 30px 0 14px; }
  .section-divider-line { flex: 1; height: 1px; background: var(--border); }
  .section-divider-label { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }

  .alloc-grid { display: grid; gap: 10px; }
  .alloc-item label { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text); margin-bottom: 6px; }
  .pot-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .alloc-item .input-wrap input { padding: 9px 10px 9px 26px; font-size: 15px; }
  .alloc-item .pound { left: 11px; font-size: 14px; }

  .pot-selector { display: grid; gap: 8px; }
  .pot-btn { padding: 10px 6px; border: 1.5px solid var(--border); border-radius: 10px; background: var(--card2); font-family: inherit; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; transition: all 0.15s; text-align: center; }
  .add-btn { width: 100%; padding: 13px; background: var(--text); border: none; border-radius: 10px; font-family: inherit; font-size: 14px; font-weight: 700; color: var(--bg); cursor: pointer; margin-top: 10px; letter-spacing: 0.05em; }
  .add-btn:active { opacity: 0.8; }
  .form-error { font-size: 12px; color: var(--red); margin-top: 8px; display: none; }
  .form-error.show { display: block; }

  .summary-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 0 11px 10px; border-bottom: 1px solid var(--border); border-left: 3px solid var(--border); }
  .summary-row:last-child { border-bottom: none; padding-bottom: 0; }
  .summary-pot-label { font-size: 12px; font-weight: 600; color: var(--text); }
  .summary-pot-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .summary-amount { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
  .summary-amount.ok { color: var(--green); }
  .summary-amount.warn { color: var(--amber); }
  .summary-amount.over { color: var(--red); }
  .summary-amount.neutral { color: var(--text); }

  .history-empty { font-size: 13px; color: var(--muted); text-align: center; padding: 6px 0 2px; }
  .history-item { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .history-item:last-child { border-bottom: none; padding-bottom: 0; }
  .history-tag { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 3px 8px; border-radius: 5px; }
  .history-amount { font-size: 15px; font-weight: 700; color: var(--text); margin-left: 7px; }
  .history-note { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .history-right { text-align: right; flex-shrink: 0; }
  .history-time { font-size: 10px; color: var(--muted); white-space: nowrap; }
  .history-remove { background: transparent; border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; font-size: 10px; color: var(--muted); cursor: pointer; font-family: inherit; margin-top: 5px; transition: all 0.15s; }
  .history-remove:hover { background: rgba(255,87,87,0.08); border-color: var(--red); color: var(--red); }

  .jnt-btn { text-decoration: none; border: 1px solid #7D756D; border-radius: 6px; padding: 3px 9px; font-size: 11px; font-weight: 500; letter-spacing: 0.06em; color: #7D756D; line-height: 1.4; transition: all 0.15s; }
  .jnt-btn:hover { background: rgba(125,117,109,0.12); color: #a89e94; border-color: #a89e94; }
  .jnt-btn.ato { border-color: rgba(240,180,41,0.45); color: var(--amber); }
  .jnt-btn.ato:hover { background: rgba(240,180,41,0.12); border-color: var(--amber); color: var(--amber); }
  .jnt-btn.alh { border-color: rgba(61,220,132,0.45); color: var(--green); }
  .jnt-btn.alh:hover { background: rgba(61,220,132,0.12); border-color: var(--green); color: var(--green); }
  .back-links { display: flex; gap: 6px; }

  .who-row { display: flex; align-items: center; gap: 8px; margin: -18px 0 22px; }
  .who-label { font-size: 11px; color: var(--muted2); }
  .who-btn { padding: 3px 10px; border: 1px solid var(--border); border-radius: 5px; background: transparent; font-family: inherit; font-size: 11px; color: var(--muted); cursor: pointer; }
  .who-btn.active.ato { background: rgba(240,180,41,0.15); border-color: rgba(240,180,41,0.4); color: var(--amber); }
  .who-btn.active.alh { background: rgba(61,220,132,0.15); border-color: rgba(61,220,132,0.4); color: var(--green); }
  .sync-state { margin-left: auto; font-size: 10px; color: var(--muted); }
  .sync-state.ok { color: var(--green); }
  .sync-state.busy { color: var(--amber); }
  .sync-state.err { color: var(--red); }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="name">ATO <span>Tracker</span></div>
    <a class="jnt-btn" href="https://andyami.github.io/atoalh/home/finance-jnt/index.html" aria-label="Open joint pot tracker">JNT</a>
    <div class="cycle" id="cycle-label"></div>
  </header>

  <div class="result-card empty" id="result-card">
    <div class="result-label">Available to spend</div>
    <div class="result-amount" id="result-amount">&#8212;</div>
    <div class="result-context" id="result-context">Enter your spends budget to begin</div>
  </div>

  <div class="card">
    <div class="card-label">RIGHT NOW</div>
    <div class="two-col">
      <div class="field">
        <label>BARCLAYS</label>
        <div class="input-wrap">
          <span class="pound">&pound;</span>
          <input type="number" inputmode="numeric" id="barclays" placeholder="0">
          <span class="saved-tag">saved</span>
        </div>
      </div>
      <div class="field">
        <label>AMEX</label>
        <div class="input-wrap">
          <span class="pound">&pound;</span>
          <input type="number" inputmode="numeric" id="amex" placeholder="0">
          <span class="saved-tag">saved</span>
        </div>
      </div>
      <div class="field">
        <label>EVERYDAY ACCOUNT</label>
        <div class="input-wrap">
          <span class="pound">&pound;</span>
          <input type="number" inputmode="numeric" id="sta" placeholder="0">
          <span class="saved-tag">saved</span>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-label">PAYDAY SPENDS</div>
    <div class="field">
      <div class="input-wrap">
        <span class="pound">&pound;</span>
        <input type="number" inputmode="numeric" id="spends" placeholder="0" class="spends-input">
        <span class="saved-tag">saved</span>
      </div>
    </div>
  </div>

  <button class="reset-btn" onclick="resetAll()">Clear all fields</button>

  <div class="section-divider">
    <div class="section-divider-line"></div>
    <div class="section-divider-label">Pot Tracking</div>
    <div class="section-divider-line"></div>
  </div>

  <div class="card">
    <div class="card-label">ALLOCATION</div>
    <div class="alloc-grid" id="alloc-grid"></div>
  </div>

  <div class="card">
    <div class="card-label">SPEND LOG</div>
    <div class="field">
      <div class="input-wrap">
        <span class="pound">&pound;</span>
        <input type="number" inputmode="numeric" id="spend-amount" placeholder="0">
      </div>
    </div>
    <div class="field">
      <div class="input-wrap">
        <input type="text" id="spend-note" class="note-input" placeholder="Note (optional)" maxlength="40">
      </div>
    </div>
    <div class="field" style="margin-bottom:0">
      <div class="pot-selector" id="pot-selector"></div>
    </div>
    <button class="add-btn" onclick="addSpend()">Add</button>
    <div class="form-error" id="spend-error"></div>
  </div>

  <div class="card">
    <div class="card-label">POT SUMMARY</div>
    <div id="summary-rows"></div>
  </div>

  <div class="card">
    <div class="card-label">SPEND HISTORY</div>
    <div id="history-list"></div>
  </div>

  <div class="footer">Budget fields &amp; pots are remembered on this device</div>

</div>
<script>
  var PFX = 'ato';

  function fmt(n) {
    return '\u00a3' + Math.round(Math.abs(n)).toLocaleString('en-GB');
  }
  function fmtSigned(n) {
    return (n < 0 ? '\u2212\u2009' : '') + fmt(n);
  }

  /* ------- BUDGET TRACKER ------- */
  var PERSIST = ["spends", "barclays", "sta", "amex"];

  function val(id) {
    var el = document.getElementById(id);
    return el ? (parseFloat(el.value) || 0) : 0;
  }

  function saveAll() {
    PERSIST.forEach(function(id) {
      try { localStorage.setItem(PFX + '_' + id, document.getElementById(id).value); } catch(e) {}
    });
  }

  function loadAll() {
    PERSIST.forEach(function(id) {
      try {
        var s = localStorage.getItem(PFX + '_' + id);
        if (s !== null && s !== '') document.getElementById(id).value = s;
      } catch(e) {}
    });
  }

  function calc() {
    saveAll();
    var spends    = val('spends');
    var amex      = val('amex');
    var barcl     = val('barclays');
    var sta       = val('sta');
    var available = (spends + sta) - amex - barcl;

    var card    = document.getElementById('result-card');
    var amount  = document.getElementById('result-amount');
    var context = document.getElementById('result-context');

    if (spends === 0) {
      card.className = 'result-card empty';
      amount.textContent = '\u2014';
      context.textContent = 'Enter your spends budget to begin';
      return;
    }

    amount.textContent = fmtSigned(available);

    if (available < 0) {
      card.className = 'result-card negative';
      context.textContent = 'Over budget by ' + fmt(available);
    } else if (available < spends * 0.25) {
      card.className = 'result-card warning';
      context.textContent = 'Nearly gone \u2014 ' + fmt(available) + ' left of ' + fmt(spends);
    } else if (available < spends * 0.5) {
      card.className = 'result-card warning';
      context.textContent = 'Past halfway \u2014 ' + fmt(available) + ' left of ' + fmt(spends);
    } else {
      card.className = 'result-card positive';
      context.textContent = fmt(available) + ' left of ' + fmt(spends) + ' budget';
    }
  }

  function resetAll() {
    PERSIST.forEach(function(id) {
      document.getElementById(id).value = '';
      try { localStorage.removeItem(PFX + '_' + id); } catch(e) {}
    });
    calc();
  }

  document.querySelectorAll('#result-card ~ .card input').forEach(function(el) {
    el.addEventListener('input', calc);
  });

  /* ------- POT TRACKING -------
     Add a pot by adding one entry to POTS below. Nothing else needs to change. */
  var POTS = [
    {
      "id": "office",
      "name": "Office",
      "colour": "#3F9A5F",
      "def": 80
    }
  ];

  var potAlloc = {};
  var potLog   = [];
  var selectedPot = POTS[0].id;

  function potById(id) {
    for (var i = 0; i < POTS.length; i++) if (POTS[i].id === id) return POTS[i];
    return POTS[0];
  }

  function hexA(hex, a) {
    var r = parseInt(hex.slice(1, 3), 16),
        g = parseInt(hex.slice(3, 5), 16),
        b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }

  function cycleKey() {
    var n = new Date(), d = n.getDate();
    var s = d >= 25 ? new Date(n.getFullYear(), n.getMonth(), 25)
                    : new Date(n.getFullYear(), n.getMonth() - 1, 25);
    return s.getFullYear() + '-' + ('0' + (s.getMonth() + 1)).slice(-2) + '-25';
  }

  function setCycle() {
    var n = new Date(), d = n.getDate();
    var s = d >= 25 ? new Date(n.getFullYear(), n.getMonth(), 25)
                    : new Date(n.getFullYear(), n.getMonth() - 1, 25);
    var e = new Date(s.getFullYear(), s.getMonth() + 1, 24);
    var o = { day: 'numeric', month: 'short' };
    document.getElementById('cycle-label').textContent =
      s.toLocaleDateString('en-GB', o) + ' \u2013 ' + e.toLocaleDateString('en-GB', o);
  }

  function buildAllocInputs() {
    var grid = document.getElementById('alloc-grid');
    grid.style.gridTemplateColumns = POTS.length > 1 ? 'repeat(' + POTS.length + ', 1fr)' : '1fr';
    var html = '';
    POTS.forEach(function(p) {
      html += '<div class="alloc-item">' +
                '<label for="alloc-' + p.id + '"><span class="pot-dot" style="background:' + p.colour + '"></span>' + p.name + '</label>' +
                '<div class="input-wrap"><span class="pound">\u00a3</span>' +
                '<input type="number" inputmode="numeric" id="alloc-' + p.id + '" placeholder="0"></div>' +
              '</div>';
    });
    grid.innerHTML = html;
    POTS.forEach(function(p) {
      document.getElementById('alloc-' + p.id).addEventListener('input', function() {
        potAlloc[p.id] = Math.round(parseFloat(this.value) || 0);
        onAllocChange(p.id);
        renderSummary();
      });
    });
  }

  function paintAllocInputs() {
    POTS.forEach(function(p) {
      var el = document.getElementById('alloc-' + p.id);
      if (el && document.activeElement !== el) el.value = potAlloc[p.id];
    });
  }

  function buildSelector() {
    var sel = document.getElementById('pot-selector');
    sel.style.gridTemplateColumns = 'repeat(' + POTS.length + ', 1fr)';
    var html = '';
    POTS.forEach(function(p) {
      html += '<button class="pot-btn" id="potbtn-' + p.id + '" onclick="selectPot(\'' + p.id + '\')">' + p.name + '</button>';
    });
    sel.innerHTML = html;
    selectPot(POTS[0].id);
  }

  function selectPot(id) {
    selectedPot = id;
    POTS.forEach(function(p) {
      var b = document.getElementById('potbtn-' + p.id);
      if (p.id === id) {
        b.style.background   = hexA(p.colour, 0.15);
        b.style.borderColor  = p.colour;
        b.style.color        = p.colour;
      } else {
        b.style.background   = '';
        b.style.borderColor  = '';
        b.style.color        = '';
      }
    });
  }

  function showErr(msg) {
    var e = document.getElementById('spend-error');
    e.textContent = msg;
    e.className = 'form-error show';
  }
  function clearErr() {
    document.getElementById('spend-error').className = 'form-error';
  }

  function amountClass(left, alloc) {
    if (left < 0) return 'over';
    if (alloc === 0) return 'neutral';
    if (left < alloc * 0.25) return 'warn';
    return 'ok';
  }

  function renderSummary() {
    var html = '';
    POTS.forEach(function(p) {
      var alloc = potAlloc[p.id] || 0;
      var spent = potLog.filter(function(e) { return e.pot === p.id; })
                        .reduce(function(s, e) { return s + e.amount; }, 0);
      var left  = alloc - spent;
      html += '<div class="summary-row" style="border-left-color:' + p.colour + '">' +
                '<div><div class="summary-pot-label">' + p.name + '</div>' +
                '<div class="summary-pot-sub">' + fmt(spent) + ' spent of ' + fmt(alloc) + '</div></div>' +
                '<div class="summary-amount ' + amountClass(left, alloc) + '">' + fmtSigned(left) + '</div>' +
              '</div>';
    });
    document.getElementById('summary-rows').innerHTML = html;
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function renderHistory() {
    var list = document.getElementById('history-list');
    if (potLog.length === 0) {
      list.innerHTML = '<div class="history-empty">No spends logged this cycle</div>';
      return;
    }
    var sorted = potLog.slice().sort(function(a, b) { return b.ts - a.ts; });
    var html = '';
    sorted.forEach(function(e) {
      var p = potById(e.pot);
      var sub = [];
      if (e.note) sub.push(esc(e.note));
      if (e.who)  sub.push(e.who);
      html += '<div class="history-item"><div>' +
                '<span class="history-tag" style="background:' + hexA(p.colour, 0.15) + ';color:' + p.colour + ';border:1px solid ' + hexA(p.colour, 0.3) + '">' + p.name + '</span>' +
                '<span class="history-amount">' + fmt(e.amount) + '</span>' +
                (sub.length ? '<div class="history-note">' + sub.join(' \u00b7 ') + '</div>' : '') +
              '</div><div class="history-right">' +
                '<div class="history-time">' + e.time + '</div>' +
                '<button class="history-remove" onclick="removeSpend(\'' + e.id + '\')">Remove</button>' +
              '</div></div>';
    });
    list.innerHTML = html;
  }

  function readSpendForm() {
    var amtEl = document.getElementById('spend-amount');
    var amount = Math.round(parseFloat(amtEl.value) || 0);
    if (amount <= 0) {
      showErr('Enter an amount first');
      amtEl.focus();
      return null;
    }
    clearErr();
    var now = new Date();
    return {
      id: String(Date.now()) + String(Math.floor(Math.random() * 1000)),
      pot: selectedPot,
      amount: amount,
      note: document.getElementById('spend-note').value.trim(),
      cycle: cycleKey(),
      ts: now.getTime(),
      time: now.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ' ' +
            now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })
    };
  }

  function clearSpendForm() {
    document.getElementById('spend-amount').value = '';
    document.getElementById('spend-note').value = '';
  }

  document.getElementById('spend-amount').addEventListener('input', clearErr);

  /* ------- LOCAL PERSISTENCE ------- */
  function onAllocChange() { savePots(); }

  function savePots() {
    try {
      localStorage.setItem(PFX + '_pot_alloc', JSON.stringify(potAlloc));
      localStorage.setItem(PFX + '_pot_log',   JSON.stringify(potLog));
      localStorage.setItem(PFX + '_pot_cycle', cycleKey());
    } catch(e) {}
  }

  function loadPots() {
    POTS.forEach(function(p) { potAlloc[p.id] = p.def; });
    try {
      var a = localStorage.getItem(PFX + '_pot_alloc');
      if (a) {
        var parsed = JSON.parse(a);
        POTS.forEach(function(p) {
          if (typeof parsed[p.id] === 'number') potAlloc[p.id] = parsed[p.id];
        });
      }
    } catch(e) {}
    try {
      var storedCycle = localStorage.getItem(PFX + '_pot_cycle');
      var log = localStorage.getItem(PFX + '_pot_log');
      potLog = (log && storedCycle === cycleKey()) ? JSON.parse(log) : [];
    } catch(e) { potLog = []; }
    savePots();
  }

  function addSpend() {
    var s = readSpendForm();
    if (!s) return;
    potLog.push(s);
    clearSpendForm();
    savePots();
    renderSummary();
    renderHistory();
  }

  function removeSpend(id) {
    potLog = potLog.filter(function(e) { return e.id !== id; });
    savePots();
    renderSummary();
    renderHistory();
  }

  setCycle();
  buildAllocInputs();
  buildSelector();
  loadAll();
  calc();
  loadPots();
  paintAllocInputs();
  renderSummary();
  renderHistory();

</script>
</body>
</html>
