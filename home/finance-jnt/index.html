<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Joint — Pot Tracker</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #0c0e0d;
        --card: #141714;
        --card2: #1c201c;
        --border: #222822;
        --border2: #2e362e;
        --text: #dde6df;
        --muted: #586860;
        --muted2: #3a4440;
        --amber: #f0b429;
        --amber-light: rgba(240, 180, 41, 0.09);
        --amber-dark: #e6a800;
        --green: #3ddc84;
        --green-light: rgba(61, 220, 132, 0.08);
        --green-dark: #2ecc70;
        --red: #ff5757;
        --red-light: rgba(255, 87, 87, 0.08);
        --accent: #7d756d;
      }
      body {
        font-family: "DM Mono", monospace;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        padding: 24px 16px 48px;
      }
      .container {
        max-width: 400px;
        margin: 0 auto;
      }
      header {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px 10px;
        margin-bottom: 28px;
      }
      .name {
        font-family: "Syne", sans-serif;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }
      .name span {
        color: var(--accent);
      }

      /* ---- Period selector (top right) ---- */
      .period-wrap {
        position: relative;
        margin-left: auto;
      }
      .period-pill {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
        color: var(--muted);
        border: 1px solid var(--border2);
        border-radius: 6px;
        padding: 4px 9px 4px 10px;
        white-space: nowrap;
        line-height: 1.4;
        transition: all 0.15s;
      }
      .period-chev {
        width: 6px;
        height: 6px;
        border-right: 1.5px solid currentColor;
        border-bottom: 1.5px solid currentColor;
        transform: translateY(-2px) rotate(45deg);
        flex-shrink: 0;
      }
      .period-wrap.off .period-pill {
        color: var(--amber);
        border-color: rgba(240, 180, 41, 0.45);
        background: rgba(240, 180, 41, 0.08);
      }
      .period-wrap select {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        font-size: 16px;
        cursor: pointer;
        -webkit-appearance: none;
        appearance: none;
      }
      .period-note {
        display: none;
        align-items: center;
        gap: 10px;
        background: rgba(240, 180, 41, 0.07);
        border: 1px solid rgba(240, 180, 41, 0.25);
        border-radius: 10px;
        padding: 10px 12px;
        margin: -10px 0 12px;
        font-size: 11px;
        line-height: 1.5;
        color: var(--amber);
      }
      .period-note.show {
        display: flex;
      }
      .period-note button {
        margin-left: auto;
        flex-shrink: 0;
        background: transparent;
        border: 1px solid rgba(240, 180, 41, 0.45);
        border-radius: 6px;
        padding: 3px 9px;
        font-family: inherit;
        font-size: 11px;
        color: var(--amber);
        cursor: pointer;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 20px;
        margin-bottom: 12px;
      }
      .card-label {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 14px;
      }
      .field {
        margin-bottom: 14px;
      }
      .field:last-child {
        margin-bottom: 0;
      }
      .input-wrap {
        position: relative;
        display: flex;
        align-items: center;
      }
      .pound {
        position: absolute;
        left: 13px;
        font-size: 16px;
        font-weight: 600;
        color: var(--muted);
        pointer-events: none;
      }
      .input-wrap input {
        width: 100%;
        padding: 11px 44px 11px 28px;
        font-size: 18px;
        font-weight: 600;
        font-family: inherit;
        border: 1.5px solid var(--border);
        border-radius: 10px;
        background: var(--card2);
        color: var(--text);
        -webkit-appearance: none;
        appearance: none;
        transition: border-color 0.15s;
      }
      .input-wrap input:focus {
        outline: none;
        border-color: var(--accent);
      }
      .input-wrap input.note-input {
        padding: 11px 13px;
        font-size: 14px;
        font-weight: 400;
      }

      .section-divider {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 30px 0 14px;
      }
      .section-divider-line {
        flex: 1;
        height: 1px;
        background: var(--border);
      }
      .section-divider-label {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        white-space: nowrap;
      }

      .alloc-grid {
        display: grid;
        gap: 10px;
      }
      .alloc-item {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }
      .alloc-item label {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
        color: var(--text);
        margin-bottom: 6px;
        line-height: 1.25;
      }
      .pot-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .alloc-item .input-wrap input {
        padding: 9px 10px 9px 26px;
        font-size: 15px;
      }
      .alloc-item .pound {
        left: 11px;
        font-size: 14px;
      }

      .pot-selector {
        position: relative;
      }
      .pot-selector .pot-dot {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        width: 10px;
        height: 10px;
        pointer-events: none;
      }
      .pot-selector select {
        width: 100%;
        padding: 12px 40px 12px 34px;
        font-family: inherit;
        font-size: 16px;
        font-weight: 600;
        border: 1.5px solid var(--border);
        border-radius: 10px;
        background: var(--card2);
        color: var(--text);
        -webkit-appearance: none;
        appearance: none;
        cursor: pointer;
        transition: border-color 0.15s, color 0.15s;
      }
      .pot-selector select:focus {
        outline: none;
      }
      .pot-selector select option {
        background: var(--card2);
        color: var(--text);
      }
      .pot-chev {
        position: absolute;
        right: 16px;
        top: 50%;
        width: 8px;
        height: 8px;
        border-right: 2px solid var(--muted);
        border-bottom: 2px solid var(--muted);
        transform: translateY(-70%) rotate(45deg);
        pointer-events: none;
      }
      .add-btn {
        width: 100%;
        padding: 13px;
        background: var(--text);
        border: none;
        border-radius: 10px;
        font-family: inherit;
        font-size: 14px;
        font-weight: 700;
        color: var(--bg);
        cursor: pointer;
        margin-top: 10px;
        letter-spacing: 0.05em;
      }
      .add-btn:active {
        opacity: 0.8;
      }
      .form-error {
        font-size: 12px;
        color: var(--red);
        margin-top: 8px;
        display: none;
      }
      .form-error.show {
        display: block;
      }

      .summary-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 11px 0 11px 10px;
        border-bottom: 1px solid var(--border);
        border-left: 3px solid var(--border);
      }
      .summary-row:last-child {
        border-bottom: none;
        padding-bottom: 0;
      }
      .summary-pot-label {
        font-size: 12px;
        font-weight: 600;
        color: var(--text);
      }
      .summary-pot-sub {
        font-size: 11px;
        color: var(--muted);
        margin-top: 2px;
      }
      .summary-amount {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.3px;
      }
      .summary-amount.ok {
        color: var(--green);
      }
      .summary-amount.warn {
        color: var(--amber);
      }
      .summary-amount.over {
        color: var(--red);
      }
      .summary-amount.neutral {
        color: var(--text);
      }

      .history-empty {
        font-size: 13px;
        color: var(--muted);
        text-align: center;
        padding: 6px 0 2px;
      }
      .history-item {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
      }
      .history-item:last-child {
        border-bottom: none;
        padding-bottom: 0;
      }
      .history-tag {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 3px 8px;
        border-radius: 5px;
      }
      .history-amount {
        font-size: 15px;
        font-weight: 700;
        color: var(--text);
        margin-left: 7px;
      }
      .history-note {
        font-size: 11px;
        color: var(--muted);
        margin-top: 4px;
      }
      .history-right {
        text-align: right;
        flex-shrink: 0;
      }
      .history-time {
        font-size: 10px;
        color: var(--muted);
        white-space: nowrap;
      }
      .history-remove {
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 2px 8px;
        font-size: 10px;
        color: var(--muted);
        cursor: pointer;
        font-family: inherit;
        margin-top: 5px;
        transition: all 0.15s;
      }
      .history-remove:hover {
        background: rgba(255, 87, 87, 0.08);
        border-color: var(--red);
        color: var(--red);
      }

      .jnt-btn {
        text-decoration: none;
        border: 1px solid #7d756d;
        border-radius: 6px;
        padding: 3px 9px;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.06em;
        color: #7d756d;
        line-height: 1.4;
        transition: all 0.15s;
      }
      .jnt-btn:hover {
        background: rgba(125, 117, 109, 0.12);
        color: #a89e94;
        border-color: #a89e94;
      }
      .jnt-btn.ato {
        border-color: rgba(240, 180, 41, 0.45);
        color: var(--amber);
      }
      .jnt-btn.ato:hover {
        background: rgba(240, 180, 41, 0.12);
        border-color: var(--amber);
        color: var(--amber);
      }
      .jnt-btn.alh {
        border-color: rgba(61, 220, 132, 0.45);
        color: var(--green);
      }
      .jnt-btn.alh:hover {
        background: rgba(61, 220, 132, 0.12);
        border-color: var(--green);
        color: var(--green);
      }
      .back-links {
        display: flex;
        gap: 6px;
      }
      .footer {
        text-align: center;
        font-size: 11px;
        color: var(--muted);
        margin-top: 24px;
      }
      .diag {
        display: none;
        background: rgba(255, 87, 87, 0.06);
        border: 1px solid rgba(255, 87, 87, 0.25);
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 12px;
        font-size: 11px;
        line-height: 1.6;
        color: var(--red);
        word-break: break-word;
      }
      .diag.show {
        display: block;
      }
      .diag b {
        display: block;
        margin-bottom: 4px;
        font-weight: 700;
      }
      .diag span {
        color: var(--muted);
      }

      .who-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: -18px 0 22px;
      }
      .who-label {
        font-size: 11px;
        color: var(--muted2);
      }
      .who-btn {
        padding: 3px 10px;
        border: 1px solid var(--border);
        border-radius: 5px;
        background: transparent;
        font-family: inherit;
        font-size: 11px;
        color: var(--muted);
        cursor: pointer;
      }
      .who-btn.active.ato {
        background: rgba(240, 180, 41, 0.15);
        border-color: rgba(240, 180, 41, 0.4);
        color: var(--amber);
      }
      .who-btn.active.alh {
        background: rgba(61, 220, 132, 0.15);
        border-color: rgba(61, 220, 132, 0.4);
        color: var(--green);
      }
      .sync-state {
        margin-left: auto;
        font-size: 10px;
        color: var(--muted);
      }
      .sync-state.ok {
        color: var(--green);
      }
      .sync-state.busy {
        color: var(--amber);
      }
      .sync-state.err {
        color: var(--red);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="name">Joint <span>Tracker</span></div>
        <span class="back-links" id="back-links"></span>
        <div class="period-wrap" id="period-wrap">
          <div class="period-pill">
            <span id="period-text"></span><span class="period-chev"></span>
          </div>
          <select
            id="period-select"
            aria-label="Pay period"
            onchange="choosePeriod(this.value)"
          ></select>
        </div>
      </header>

      <div class="who-row">
        <span class="who-label">This device:</span>
        <button class="who-btn ato" id="who-ATO" onclick="setWho('ATO')">
          ATO
        </button>
        <button class="who-btn alh" id="who-ALH" onclick="setWho('ALH')">
          ALH
        </button>
        <span class="sync-state" id="sync-state">Connecting&#8230;</span>
      </div>

      <div class="period-note" id="period-note">
        <span id="period-note-text"></span>
        <button onclick="choosePeriod(currentPeriod())">Current</button>
      </div>

      <div class="diag" id="diag"></div>

      <div class="section-divider">
        <div class="section-divider-line"></div>
        <div class="section-divider-label">Pot Tracking</div>
        <div class="section-divider-line"></div>
      </div>

      <div class="card">
        <div class="card-label">ALLOCATION</div>
        <div class="alloc-grid" id="alloc-grid"></div>
      </div>

      <div class="card">
        <div class="card-label">SPEND LOG</div>
        <div class="field">
          <div class="input-wrap">
            <span class="pound">&pound;</span>
            <input
              type="number"
              inputmode="numeric"
              id="spend-amount"
              placeholder="0"
            />
          </div>
        </div>
        <div class="field">
          <div class="input-wrap">
            <input
              type="text"
              id="spend-note"
              class="note-input"
              placeholder="Note (optional)"
              maxlength="40"
            />
          </div>
        </div>
        <div class="field" style="margin-bottom: 0">
          <div class="pot-selector" id="pot-selector"></div>
        </div>
        <button class="add-btn" onclick="addSpend()">Add</button>
        <div class="form-error" id="spend-error"></div>
      </div>

      <div class="card">
        <div class="card-label">POT SUMMARY</div>
        <div id="summary-rows"></div>
      </div>

      <div class="card">
        <div class="card-label">SPEND HISTORY</div>
        <div id="history-list"></div>
      </div>

      <div class="footer">
        Shared between both devices &middot; a new period starts each payday
      </div>
    </div>
    <script>
      var PFX = "jnt";

      function fmt(n) {
        return "\u00a3" + Math.round(Math.abs(n)).toLocaleString("en-GB");
      }
      function fmtSigned(n) {
        return (n < 0 ? "\u2212\u2009" : "") + fmt(n);
      }
      function esc(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      /* ------- POTS -------
     Add a pot by adding one entry to POTS below. Nothing else needs to change.
     "def" is the allocation each new period starts with. */
      var POTS = [
        { id: "shopping", name: "Shopping", colour: "#6582fc", def: 200 },
        { id: "petrol", name: "Petrol", colour: "#a36bf9", def: 150 },
        { id: "bobby", name: "Bobby", colour: "#E68346", def: 0 },
        { id: "joint", name: "Joint Purchases", colour: "#00B050", def: 0 },
        { id: "home", name: "Home Maintenance", colour: "#FF96F6", def: 100 },
      ];

      /* ------- PAY PERIODS -------
     Payday is the 25th. If the 25th is a weekend or an England & Wales bank
     holiday, payday moves back to the previous working day (so a weekend 25th
     becomes the Friday before).

     PAY_OVERRIDES fixes any month that doesn't follow that rule — mainly
     Christmas. Add a line each year once you know the date: "YYYY-MM": day
     A December with no override falls back to the rule above (24th or earlier). */
      var PAY_OVERRIDES = {
        "2026-12": 21,
      };
      var FIRST_PERIOD = "2026-09"; // earliest period the dropdown will offer
      var PAST_PERIODS = 5; // how many past periods the dropdown shows
      // The old single set of allocations was entered for this period.
      var LEGACY_ALLOC_PERIOD = "2026-10";

      function pad(n) {
        return ("0" + n).slice(-2);
      }
      function keyOf(y, m0) {
        var d = new Date(y, m0, 1);
        return d.getFullYear() + "-" + pad(d.getMonth() + 1);
      }
      function parseKey(k) {
        return {
          y: parseInt(k.slice(0, 4), 10),
          m0: parseInt(k.slice(5, 7), 10) - 1,
        };
      }
      function addPeriods(k, n) {
        var p = parseKey(k);
        return keyOf(p.y, p.m0 + n);
      }
      function sameDay(a, b) {
        return (
          a.getFullYear() === b.getFullYear() &&
          a.getMonth() === b.getMonth() &&
          a.getDate() === b.getDate()
        );
      }
      function easterSunday(y) {
        var a = y % 19,
          b = Math.floor(y / 100),
          c = y % 100,
          d = Math.floor(b / 4),
          e = b % 4,
          f = Math.floor((b + 8) / 25),
          g = Math.floor((b - f + 1) / 3),
          h = (19 * a + b - d - g + 15) % 30,
          i = Math.floor(c / 4),
          k = c % 4,
          l = (32 + 2 * e + 2 * i - h - k) % 7,
          m = Math.floor((a + 11 * h + 22 * l) / 451),
          month = Math.floor((h + l - 7 * m + 114) / 31),
          day = ((h + l - 7 * m + 114) % 31) + 1;
        return new Date(y, month - 1, day);
      }
      function lastMonday(y, m0) {
        var d = new Date(y, m0 + 1, 0);
        while (d.getDay() !== 1) d.setDate(d.getDate() - 1);
        return d;
      }
      // Only bank holidays that can land on or just before the 25th matter.
      function isBankHoliday(d) {
        var y = d.getFullYear(),
          e = easterSunday(y);
        var list = [
          new Date(y, e.getMonth(), e.getDate() - 2), // Good Friday
          new Date(y, e.getMonth(), e.getDate() + 1), // Easter Monday
          lastMonday(y, 4), // Spring bank holiday
          lastMonday(y, 7), // Summer bank holiday
          new Date(y, 11, 25),
          new Date(y, 11, 26),
        ];
        return list.some(function (h) {
          return sameDay(h, d);
        });
      }

      var payCache = {};
      function payDate(k) {
        if (!payCache[k]) {
          var p = parseKey(k),
            d;
          if (PAY_OVERRIDES[k]) {
            d = new Date(p.y, p.m0, PAY_OVERRIDES[k]);
          } else {
            d = new Date(p.y, p.m0, 25);
            while (d.getDay() === 0 || d.getDay() === 6 || isBankHoliday(d))
              d.setDate(d.getDate() - 1);
          }
          payCache[k] = d.getTime();
        }
        return new Date(payCache[k]);
      }
      function periodEnd(k) {
        var d = payDate(addPeriods(k, 1));
        d.setDate(d.getDate() - 1);
        return d;
      }
      function currentPeriod() {
        var n = new Date();
        var today = new Date(n.getFullYear(), n.getMonth(), n.getDate());
        var k = keyOf(today.getFullYear(), today.getMonth());
        if (today < payDate(k)) k = addPeriods(k, -1);
        return k;
      }
      var MONTHS = "Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec".split(" ");
      function shortDate(d) {
        return d.getDate() + " " + MONTHS[d.getMonth()];
      }
      function periodLabel(k) {
        return shortDate(payDate(k)) + " \u2013 " + shortDate(periodEnd(k));
      }
      function periodList() {
        var cur = currentPeriod(),
          out = [];
        for (var i = -PAST_PERIODS; i <= 1; i++) {
          var k = addPeriods(cur, i);
          if (k >= FIRST_PERIOD) out.push(k);
        }
        return out;
      }

      /* ------- STATE ------- */
      var period = currentPeriod();
      var pinned = false; // true when a non-current period was picked by hand
      var cfgFields = {}; // config/current fields (all periods' allocations)
      var dirty = {}; // field names edited locally, not yet saved
      var cfgSeq = 0; // bumps on every allocation write
      var spendSeq = 0; // bumps on every spend add/remove
      var potLog = [];
      var selectedPot = POTS[0].id;
      var allocTimer = null;
      var who = null;

      function allocField(k, potId) {
        return "p_" + k.replace("-", "_") + "_" + potId;
      }
      function allocFor(k, potId) {
        var f = cfgFields[allocField(k, potId)];
        if (f) return parseInt(f.integerValue, 10) || 0;
        if (k === LEGACY_ALLOC_PERIOD && cfgFields["alloc_" + potId])
          return parseInt(cfgFields["alloc_" + potId].integerValue, 10) || 0;
        return potById(potId).def;
      }
      function potById(id) {
        for (var i = 0; i < POTS.length; i++)
          if (POTS[i].id === id) return POTS[i];
        return POTS[0];
      }
      function hexA(hex, a) {
        var r = parseInt(hex.slice(1, 3), 16),
          g = parseInt(hex.slice(3, 5), 16),
          b = parseInt(hex.slice(5, 7), 16);
        return "rgba(" + r + "," + g + "," + b + "," + a + ")";
      }

      /* ------- PERIOD SELECTOR ------- */
      function renderPeriodSelect() {
        var cur = currentPeriod();
        var list = periodList();
        if (list.indexOf(period) === -1) list.push(period);
        list.sort();
        var html = "";
        list.forEach(function (k) {
          var tag = k === cur ? " \u00b7 current" : k > cur ? " \u00b7 next" : "";
          html +=
            '<option value="' +
            k +
            '"' +
            (k === period ? " selected" : "") +
            ">" +
            periodLabel(k) +
            tag +
            "</option>";
        });
        var sel = document.getElementById("period-select");
        sel.innerHTML = html;
        sel.value = period;
        document.getElementById("period-text").textContent =
          periodLabel(period);
        document.getElementById("period-wrap").className =
          "period-wrap" + (period === cur ? "" : " off");

        var note = document.getElementById("period-note");
        if (period === cur) {
          note.className = "period-note";
        } else {
          document.getElementById("period-note-text").textContent =
            (period < cur ? "Past period." : "Next period.") +
            " Allocations and spends you add here are saved to " +
            periodLabel(period) +
            ".";
          note.className = "period-note show";
        }
      }

      function choosePeriod(k) {
        if (k === period) return;
        period = k;
        pinned = k !== currentPeriod();
        potLog = [];
        spendSeq++;
        renderPeriodSelect();
        paintAllocInputs(true);
        renderSummary();
        renderHistory(true);
        clearErr();
        pullAll(false);
      }

      // Called on each poll: if the page is left open over payday, move on
      // to the new period unless a different one was picked by hand.
      function checkRollover() {
        var cur = currentPeriod();
        if (!pinned && period !== cur) {
          period = cur;
          potLog = [];
          spendSeq++;
          paintAllocInputs(true);
          renderSummary();
          renderHistory(true);
        }
        renderPeriodSelect();
      }

      /* ------- ALLOCATION ------- */
      function buildAllocInputs() {
        var grid = document.getElementById("alloc-grid");
        grid.style.gridTemplateColumns =
          "repeat(" + Math.min(POTS.length, 3) + ", 1fr)";
        var html = "";
        POTS.forEach(function (p) {
          html +=
            '<div class="alloc-item">' +
            '<label for="alloc-' +
            p.id +
            '"><span class="pot-dot" style="background:' +
            p.colour +
            '"></span>' +
            p.name +
            "</label>" +
            '<div class="input-wrap"><span class="pound">\u00a3</span>' +
            '<input type="number" inputmode="numeric" id="alloc-' +
            p.id +
            '" placeholder="0"></div>' +
            "</div>";
        });
        grid.innerHTML = html;
        POTS.forEach(function (p) {
          document
            .getElementById("alloc-" + p.id)
            .addEventListener("input", function () {
              var f = allocField(period, p.id);
              cfgFields[f] = {
                integerValue: String(Math.round(parseFloat(this.value) || 0)),
              };
              dirty[f] = true;
              cfgSeq++;
              clearTimeout(allocTimer);
              allocTimer = setTimeout(flushAllocs, 700);
              renderSummary();
            });
        });
      }

      function paintAllocInputs(force) {
        POTS.forEach(function (p) {
          var el = document.getElementById("alloc-" + p.id);
          if (el && (force || document.activeElement !== el))
            el.value = allocFor(period, p.id);
        });
      }

      function flushAllocs() {
        var names = Object.keys(dirty);
        if (!names.length || !CONFIGURED) return;
        dirty = {};
        cfgSeq++;
        var fields = {},
          mask = "";
        names.forEach(function (n) {
          fields[n] = cfgFields[n];
          mask += "&updateMask.fieldPaths=" + n;
        });
        setSync("busy", "Saving\u2026");
        fbFetch(fbUrl("/config/current", mask), {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ fields: fields }),
        })
          .then(function () {
            setSync("ok", "Synced");
            hideDiag();
          })
          .catch(function (e) {
            names.forEach(function (n) {
              dirty[n] = true;
            });
            fbErr("Allocation not saved", e);
          });
      }

      /* ------- SPEND FORM ------- */
      function buildSelector() {
        var wrap = document.getElementById("pot-selector");
        var html =
          '<span class="pot-dot" id="pot-select-dot"></span>' +
          '<select id="pot-select" aria-label="Pot" onchange="selectPot(this.value)">';
        POTS.forEach(function (p) {
          html += '<option value="' + p.id + '">' + p.name + "</option>";
        });
        html += '</select><span class="pot-chev"></span>';
        wrap.innerHTML = html;
        selectPot(POTS[0].id);
      }

      function selectPot(id) {
        var p = potById(id);
        selectedPot = p.id;
        var sel = document.getElementById("pot-select");
        sel.value = p.id;
        sel.style.background = hexA(p.colour, 0.12);
        sel.style.borderColor = p.colour;
        sel.style.color = p.colour;
        document.getElementById("pot-select-dot").style.background = p.colour;
      }

      function showErr(msg) {
        var e = document.getElementById("spend-error");
        e.textContent = msg;
        e.className = "form-error show";
      }
      function clearErr() {
        document.getElementById("spend-error").className = "form-error";
      }

      function readSpendForm() {
        var amtEl = document.getElementById("spend-amount");
        var amount = Math.round(parseFloat(amtEl.value) || 0);
        if (amount <= 0) {
          showErr("Enter an amount first");
          amtEl.focus();
          return null;
        }
        clearErr();
        var now = new Date();
        return {
          id: "",
          pot: selectedPot,
          amount: amount,
          note: document.getElementById("spend-note").value.trim(),
          cycle: period,
          ts: now.getTime(),
          time:
            now.toLocaleDateString("en-GB", {
              day: "numeric",
              month: "short",
            }) +
            " " +
            now.toLocaleTimeString("en-GB", {
              hour: "2-digit",
              minute: "2-digit",
            }),
        };
      }

      function clearSpendForm() {
        document.getElementById("spend-amount").value = "";
        document.getElementById("spend-note").value = "";
      }

      document
        .getElementById("spend-amount")
        .addEventListener("input", clearErr);

      /* ------- RENDER ------- */
      function amountClass(left, alloc) {
        if (left < 0) return "over";
        if (alloc === 0) return "neutral";
        if (left < alloc * 0.25) return "warn";
        return "ok";
      }

      function renderSummary() {
        var html = "";
        POTS.forEach(function (p) {
          var alloc = allocFor(period, p.id);
          var spent = potLog
            .filter(function (e) {
              return e.pot === p.id;
            })
            .reduce(function (s, e) {
              return s + e.amount;
            }, 0);
          var left = alloc - spent;
          html +=
            '<div class="summary-row" style="border-left-color:' +
            p.colour +
            '">' +
            '<div><div class="summary-pot-label">' +
            p.name +
            "</div>" +
            '<div class="summary-pot-sub">' +
            fmt(spent) +
            " spent of " +
            fmt(alloc) +
            "</div></div>" +
            '<div class="summary-amount ' +
            amountClass(left, alloc) +
            '">' +
            fmtSigned(left) +
            "</div>" +
            "</div>";
        });
        document.getElementById("summary-rows").innerHTML = html;
      }

      function renderHistory(loading) {
        var list = document.getElementById("history-list");
        if (potLog.length === 0) {
          list.innerHTML =
            '<div class="history-empty">' +
            (loading ? "Loading\u2026" : "No spends logged in this period") +
            "</div>";
          return;
        }
        var sorted = potLog.slice().sort(function (a, b) {
          return b.ts - a.ts;
        });
        var html = "";
        sorted.forEach(function (e) {
          var p = potById(e.pot);
          var sub = [];
          if (e.note) sub.push(esc(e.note));
          if (e.who) sub.push(e.who);
          html +=
            '<div class="history-item"><div>' +
            '<span class="history-tag" style="background:' +
            hexA(p.colour, 0.15) +
            ";color:" +
            p.colour +
            ";border:1px solid " +
            hexA(p.colour, 0.3) +
            '">' +
            p.name +
            "</span>" +
            '<span class="history-amount">' +
            fmt(e.amount) +
            "</span>" +
            (sub.length
              ? '<div class="history-note">' + sub.join(" \u00b7 ") + "</div>"
              : "") +
            '</div><div class="history-right">' +
            '<div class="history-time">' +
            e.time +
            "</div>" +
            '<button class="history-remove" onclick="removeSpend(\'' +
            e.id +
            "')\">Remove</button>" +
            "</div></div>";
        });
        list.innerHTML = html;
      }

      /* ------- SHARED STORAGE (Firebase Firestore REST) ------- */
      var FB_PROJECT = "atoalh-pots";
      var FB_KEY = "AIzaSyDIB_ztBaofZYfhfV5OdvFFT81JxSpVTdI";

      var FB_ROOT =
        "https://firestore.googleapis.com/v1/projects/" +
        FB_PROJECT +
        "/databases/(default)/documents";

      function fbUrl(path, extra) {
        return FB_ROOT + path + "?key=" + FB_KEY + (extra || "");
      }

      var CONFIGURED =
        FB_PROJECT !== "YOUR_PROJECT_ID" && FB_KEY !== "YOUR_WEB_API_KEY";

      function showDiag(title, detail, hint) {
        var el = document.getElementById("diag");
        el.innerHTML =
          "<b>" +
          title +
          "</b>" +
          esc(detail) +
          (hint ? "<br><br><span>" + hint + "</span>" : "");
        el.className = "diag show";
      }
      function hideDiag() {
        document.getElementById("diag").className = "diag";
      }

      function hintFor(status, msg) {
        if (status === 403 && /API key/i.test(msg))
          return "The API key is being rejected. If you restricted it to a website, check the entry is exactly andyami.github.io/* — or remove the restriction and try again.";
        if (status === 403)
          return "Firestore refused the request. Check the security rules allow read and write on the spends and config collections.";
        if (status === 404)
          return "Project or database not found. Check FB_PROJECT matches your projectId exactly, and that Firestore is created in Native mode.";
        if (status === 400)
          return "The request was rejected. This usually means the API key belongs to a different project than FB_PROJECT.";
        if (status === 401)
          return "Not authorised. Check FB_KEY is the Web API key from Project settings, not a server key.";
        return "Check the phone has signal, then confirm FB_PROJECT and FB_KEY in the file.";
      }

      function fbFetch(url, opts) {
        return fetch(url, opts).then(function (r) {
          return r.text().then(function (t) {
            var j = null;
            try {
              j = JSON.parse(t);
            } catch (e) {}
            if (!r.ok) {
              var err0 = Array.isArray(j) ? j[0] : j;
              var msg =
                err0 && err0.error && err0.error.message
                  ? err0.error.message
                  : "HTTP " + r.status;
              var err = new Error(msg);
              err.status = r.status;
              throw err;
            }
            return j;
          });
        });
      }

      function fbErr(what, e) {
        var status = e.status || 0;
        var msg = e.message || "Network error";
        setSync("err", what);
        showDiag(
          what + " · " + (status ? "HTTP " + status : "no response"),
          msg,
          hintFor(status, msg),
        );
      }

      function setSync(state, text) {
        var el = document.getElementById("sync-state");
        el.className = "sync-state " + state;
        el.textContent = text;
      }

      var BASE = "https://andyami.github.io/atoalh/home/finance-";

      function renderBackLinks() {
        var show = who ? [who] : ["ATO", "ALH"];
        document.getElementById("back-links").innerHTML = show
          .map(function (x) {
            return (
              '<a class="jnt-btn ' +
              x.toLowerCase() +
              '" href="' +
              BASE +
              x.toLowerCase() +
              '/index.html" aria-label="Open ' +
              x +
              ' tracker">' +
              x +
              "</a>"
            );
          })
          .join("");
      }

      function setWho(w) {
        who = w;
        ["ATO", "ALH"].forEach(function (x) {
          var b = document.getElementById("who-" + x);
          b.className =
            "who-btn " +
            x.toLowerCase() +
            (x === w ? " active " + x.toLowerCase() : "");
        });
        try {
          localStorage.setItem(PFX + "_who", w);
        } catch (e) {}
        renderBackLinks();
        clearErr();
      }

      function toDoc(s) {
        return {
          fields: {
            pot: { stringValue: s.pot },
            amount: { integerValue: String(s.amount) },
            note: { stringValue: s.note || "" },
            who: { stringValue: s.who || "" },
            cycle: { stringValue: s.cycle },
            ts: { integerValue: String(s.ts) },
            time: { stringValue: s.time },
          },
        };
      }

      function fromDoc(d) {
        var f = d.fields || {};
        return {
          id: d.name.split("/").pop(),
          pot: f.pot ? f.pot.stringValue : "",
          amount: f.amount ? parseInt(f.amount.integerValue, 10) : 0,
          note: f.note ? f.note.stringValue : "",
          who: f.who ? f.who.stringValue : "",
          cycle: f.cycle ? f.cycle.stringValue : "",
          ts: f.ts ? parseInt(f.ts.integerValue, 10) : 0,
          time: f.time ? f.time.stringValue : "",
        };
      }

      // Spends for one period. Older spends were stored with a "YYYY-MM-25"
      // cycle key, so both forms are matched.
      function loadSpends(k) {
        return fbFetch(fbUrl(":runQuery"), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            structuredQuery: {
              from: [{ collectionId: "spends" }],
              where: {
                fieldFilter: {
                  field: { fieldPath: "cycle" },
                  op: "IN",
                  value: {
                    arrayValue: {
                      values: [{ stringValue: k }, { stringValue: k + "-25" }],
                    },
                  },
                },
              },
            },
          }),
        }).then(function (rows) {
          return (rows || [])
            .filter(function (r) {
              return r.document;
            })
            .map(function (r) {
              return fromDoc(r.document);
            });
        });
      }

      function pullAll(silent) {
        if (!CONFIGURED) {
          setSync("err", "Not set up");
          showDiag(
            "Firebase not configured",
            "FB_PROJECT and FB_KEY are still set to their placeholder values.",
            "Open home/finance-jnt/index.html and complete the setup guide.",
          );
          return;
        }
        if (!silent) setSync("busy", "Syncing\u2026");
        var k = period,
          cSeq = cfgSeq,
          sSeq = spendSeq;

        fbFetch(fbUrl("/config/current"))
          .then(function (cfg) {
            if (cSeq !== cfgSeq) return; // a newer local edit wins
            var fresh = (cfg && cfg.fields) || {};
            Object.keys(dirty).forEach(function (n) {
              fresh[n] = cfgFields[n];
            });
            cfgFields = fresh;
            if (k !== period) return;
            paintAllocInputs(false);
            renderSummary();
          })
          .catch(function (e) {
            if (e.status !== 404) fbErr("Could not read allocations", e);
          });

        loadSpends(k)
          .then(function (docs) {
            if (k !== period || sSeq !== spendSeq) return;
            potLog = docs;
            renderSummary();
            renderHistory(false);
            setSync("ok", "Synced");
            hideDiag();
          })
          .catch(function (e) {
            if (k === period) renderHistory(false);
            fbErr("Could not load spends", e);
          });
      }

      function addSpend() {
        if (!who) {
          showErr("Choose ATO or ALH at the top first");
          return;
        }
        var s = readSpendForm();
        if (!s) return;
        s.who = who;
        clearSpendForm();
        spendSeq++;
        setSync("busy", "Saving\u2026");
        fbFetch(fbUrl("/spends"), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(toDoc(s)),
        })
          .then(function (d) {
            s.id = d.name.split("/").pop();
            if (s.cycle === period) {
              potLog.push(s);
              renderSummary();
              renderHistory(false);
            }
            setSync("ok", "Synced");
            hideDiag();
          })
          .catch(function (e) {
            document.getElementById("spend-amount").value = s.amount;
            document.getElementById("spend-note").value = s.note;
            fbErr("Spend not saved", e);
          });
      }

      function removeSpend(id) {
        potLog = potLog.filter(function (e) {
          return e.id !== id;
        });
        spendSeq++;
        renderSummary();
        renderHistory(false);
        setSync("busy", "Saving\u2026");
        fbFetch(fbUrl("/spends/" + id), { method: "DELETE" })
          .then(function () {
            setSync("ok", "Synced");
            hideDiag();
          })
          .catch(function (e) {
            fbErr("Spend not removed", e);
          });
      }

      /* ------- START ------- */
      buildAllocInputs();
      buildSelector();
      renderPeriodSelect();
      paintAllocInputs(true);
      renderSummary();
      renderHistory(true);

      renderBackLinks();
      try {
        var savedWho = localStorage.getItem(PFX + "_who");
        if (savedWho) setWho(savedWho);
      } catch (e) {}

      pullAll(false);
      setInterval(function () {
        if (!document.hidden) {
          checkRollover();
          pullAll(true);
        }
      }, 30000);
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) {
          checkRollover();
          pullAll(true);
        }
      });
    </script>
  </body>
</html>
