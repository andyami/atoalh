<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ATO Tools">
<title>ATOALH — Menu</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Mono', monospace;
  background: #0c0e0d;
  color: #dde6df;
  padding: 24px 32px 64px;
  min-height: 100vh;
}

.dashboard { max-width: 1160px; margin: 0 auto; }

.top-bar {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 28px;
}
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid #c8a97a;
  color: #c8a97a;
  border-radius: 999px;
  padding: 8px 16px;
  font-size: 12px;
  font-family: 'DM Mono', monospace;
  text-decoration: none;
}

.board { display: flex; gap: 24px; align-items: flex-start; }
.column { flex: 1 1 0; min-width: 0; }

.column-header { padding: 0 2px; margin-bottom: 10px; }
.column-header h2 {
  font-family: 'Syne', sans-serif;
  font-size: 11px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.05em;
}

.column-finances .column-header h2 { color: #4a9eff; }
.column-food     .column-header h2 { color: #c8a97a; }
.column-other    .column-header h2 { color: #ff6b5c; }
.column-life     .column-header h2 { color: #e6b800; }

.tool-card {
  display: flex; align-items: center; gap: 10px;
  background: #141714;
  border: 1px solid #222822;
  border-radius: 10px; padding: 10px 14px; margin-bottom: 6px;
  text-decoration: none; color: #dde6df;
  transition: background 0.12s, border-color 0.12s;
  -webkit-tap-highlight-color: transparent; cursor: pointer;
}
.tool-card:hover { background: #1c201c; border-color: #2e362e; }
.tool-card:active { transform: scale(0.98); }

.tool-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.tool-card span.title { font-size: 14px; flex: 1; }
.tool-arrow { font-size: 16px; color: #3a4440; flex-shrink: 0; }

.footer { text-align: center; font-size: 11px; color: #3a4440; margin-top: 28px; }

@media (max-width: 980px) {
  body { padding: 20px 20px 48px; }
  .board { flex-wrap: wrap; }
  .column { flex: 1 1 calc(50% - 12px); }
}
@media (max-width: 560px) {
  body { padding: 16px 16px 48px; }
  .board { flex-direction: column; }
  .column { flex: 1 1 100%; }
}
</style>
</head>
<body>
<div class="dashboard">

  <div class="top-bar">
    <a class="back-btn" href="https://andyami.github.io/atoalh/">← Brief</a>
  </div>

  <div class="board">

    <div class="column column-finances">
      <div class="column-header"><h2>Finances</h2></div>
      <a class="tool-card" href="../home/finance-ato/index.html">
        <span class="tool-dot" style="background:#A48300"></span>
        <span class="title">ATO Finance</span>
        <span class="tool-arrow">›</span>
      </a>
      <a class="tool-card" href="../home/finance-alh/index.html">
        <span class="tool-dot" style="background:#216A39"></span>
        <span class="title">ALH Finance</span>
        <span class="tool-arrow">›</span>
      </a>
      <a class="tool-card" href="../home/finance-jnt/index.html">
        <span class="tool-dot" style="background:#A79B8E"></span>
        <span class="title">Joint Pots</span>
        <span class="tool-arrow">›</span>
      </a>
    </div>

    <div class="column column-food">
      <div class="column-header"><h2>Food</h2></div>
      <a class="tool-card" href="../home/weekly-meal-planner/index.html">
        <span class="tool-dot" style="background:#c8a97a"></span>
        <span class="title">Weekly Meal Planner</span>
        <span class="tool-arrow">›</span>
      </a>
      <a class="tool-card" href="../home/meal-prep-planner/index.html">
        <span class="tool-dot" style="background:#c8a97a"></span>
        <span class="title">Meal Prep Planner</span>
        <span class="tool-arrow">›</span>
      </a>
      <a class="tool-card" href="../home/recipe-database/index.html">
        <span class="tool-dot" style="background:#c8a97a"></span>
        <span class="title">Recipe Database</span>
        <span class="tool-arrow">›</span>
      </a>
      <a class="tool-card" href="../home/food-database/index.html">
        <span class="tool-dot" style="background:#c8a97a"></span>
        <span class="title">Food Database</span>
        <span class="tool-arrow">›</span>
      </a>
    </div>

    <div class="column column-other">
      <div class="column-header"><h2>Other</h2></div>
      <a class="tool-card" href="../home/book-library/index.html">
        <span class="tool-dot" style="background:#ff6b5c"></span>
        <span class="title">Book Library</span>
        <span class="tool-arrow">›</span>
      </a>
      <a class="tool-card" href="../home/temporary/index.html">
        <span class="tool-dot" style="background:#ff6b5c"></span>
        <span class="title">Temporary</span>
        <span class="tool-arrow">›</span>
      </a>
    </div>

    <div class="column column-life">
      <div class="column-header"><h2>Life & Health</h2></div>
      <a class="tool-card" href="../ato-life/exercise-nutrition-today/index.html">
        <span class="tool-dot" style="background:#e6b800"></span>
        <span class="title">Exercise & Nutrition</span>
        <span class="tool-arrow">›</span>
      </a>
      <a class="tool-card" href="../ato-life/srsandp/index.html">
        <span class="tool-dot" style="background:#e6b800"></span>
        <span class="title">SRS&P</span>
        <span class="tool-arrow">›</span>
      </a>
      <a class="tool-card" href="../ato-life/exercise-planner/index.html">
        <span class="tool-dot" style="background:#e6b800"></span>
        <span class="title">Exercise Planner</span>
        <span class="tool-arrow">›</span>
      </a>
    </div>

  </div>

</div>
</body>
</html>
