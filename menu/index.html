<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ATO Tools">
<title>ATOALH — Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0c0e0d;
  --panel: #131614;
  --line: #1f2520;
  --text: #dde6df;
  --muted: #7d887f;
  --gold: #c8a97a;
  --icon: 88px;
}
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: 'Instrument Sans', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: max(24px, env(safe-area-inset-top)) 32px 64px;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.dashboard { max-width: 1160px; margin: 0 auto; }

.top-bar {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 28px;
}
.top-bar h1 { font-size: 22px; font-weight: 500; letter-spacing: -0.01em; }
.back-btn {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--gold); color: var(--gold);
  border-radius: 999px; padding: 8px 16px;
  font-size: 13px; font-weight: 500; text-decoration: none;
}

.board {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 20px;
}
.group {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 18px 20px 22px;
}
.group h2 {
  font-size: 13px; font-weight: 500;
  letter-spacing: 0.01em;
  margin-bottom: 18px;
}
.group-finances h2 { color: #4a9eff; }
.group-food     h2 { color: #c8a97a; }
.group-other    h2 { color: #ff6b5c; }
.group-life     h2 { color: #e6b800; }

.grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 18px 12px;
}
.app {
  display: flex; flex-direction: column; align-items: center; gap: 9px;
  text-decoration: none; color: var(--text);
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  user-select: none;
}
.icon {
  width: var(--icon); height: var(--icon);
  border-radius: 23%;
  display: grid; place-items: center;
  background: linear-gradient(155deg, var(--c1) 0%, var(--c2) 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.22),
    inset 0 -1px 0 rgba(0,0,0,0.18),
    0 6px 16px rgba(0,0,0,0.35);
  color: #fff;
  transition: transform 0.14s ease, filter 0.14s ease;
}
.icon svg {
  width: 46%; height: 46%;
  fill: none; stroke: currentColor; stroke-width: 1.8;
  stroke-linecap: round; stroke-linejoin: round;
  filter: drop-shadow(0 1px 1px rgba(0,0,0,0.25));
}
.app:hover .icon { filter: brightness(1.08); }
.app:active .icon { transform: scale(0.92); filter: brightness(0.92); }
.label {
  font-size: 13px; font-weight: 400; line-height: 1.25;
  text-align: center; max-width: 100%;
  overflow-wrap: anywhere;
}

@media (max-width: 980px) {
  :root { --icon: 80px; }
  body { padding: max(20px, env(safe-area-inset-top)) 20px 48px; }
  .board { gap: 16px; }
}
@media (max-width: 760px) {
  .board { grid-template-columns: 1fr; }
}
@media (max-width: 440px) {
  :root { --icon: 64px; }
  body { padding: max(16px, env(safe-area-inset-top)) 14px 40px; }
  .group { padding: 16px 12px 18px; border-radius: 18px; }
  .grid { gap: 16px 8px; }
  .label { font-size: 12px; }
}
</style>
</head>
